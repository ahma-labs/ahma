[package]
authors.workspace = true
edition.workspace = true
license.workspace = true
name = "ahma_http_mcp_client"
description = "Async MCP client for the Streamable HTTP transport (MCP 2025-03-26) with OAuth2 and SSE support. Part of the ahma AI-agent execution platform (MIT OR Apache-2.0)."
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
parking_lot.workspace = true
ahma_common = { path = "../ahma_common" }
anyhow.workspace = true
async-stream = "0.3"
async-trait.workspace = true
# The local-socket MCP client (`local_socket_client`): rmcp's own is Unix-only.
bytes = "1.12"
dirs.workspace = true
futures.workspace = true
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# No default features: they enable `reqwest`+`rustls-tls`, which links a second
# reqwest major (0.12) and the `ring` provider into every binary. Token requests
# go through `oauth_http::OAuthHttpClient` over the workspace reqwest instead.
oauth2 = { version = "5.0", default-features = false }
reqwest = { workspace = true, features = ["json", "stream", "http3"] }
rmcp = { workspace = true, features = ["client"] }
serde.workspace = true
serde_json.workspace = true
sse-stream = "0.2"
thiserror.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "net",
] }
tracing.workspace = true
url.workspace = true
webbrowser = "1.2"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
axum = { version = "0.8", features = ["tokio"] }
hyper = { version = "1", features = ["server"] }
tower-service = "0.3"
clap = { version = "4.6", features = ["derive"] }
tempfile.workspace = true
tracing-subscriber = "0.3"
wiremock = "0.6"

[[example]]
name = "stress_test"
path = "examples/stress_test.rs"

[[example]]
name = "oauth_mcp_client"
path = "examples/oauth_mcp_client.rs"
