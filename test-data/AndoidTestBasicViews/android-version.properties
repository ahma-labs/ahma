# Android Play Store version properties
#
# VERSION_CODE  — strictly increasing integer uploaded to Google Play.
#                 Never re-use a code; Play rejects duplicates.
#                 Max allowed by Play: 2,100,000,000.
#                 Bump this INDEPENDENTLY of the Cargo / semver version.
#                 Previous semver-derived codes 30706 and 30707 were already used,
#                 so this counter starts at 30708.
#                 Run `cargo xtask bump-android-version` before every release build.
#
# VERSION_NAME  — human-readable string shown in Play Console and on-device.
#                 Mirrors the Cargo workspace version; updated automatically by
#                 `cargo xtask bump-android-version`.
#
VERSION_CODE=30708
VERSION_NAME=0.7.3
