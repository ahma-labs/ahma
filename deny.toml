# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/
#
# Run locally:  cargo deny check
# CI:           EmbarkStudios/cargo-deny-action@v2 (see .github/workflows/build.yml)

# ---------------------------------------------------------------------------
# Advisories – block known-vulnerable and yanked crates (RustSec advisory DB)
# ---------------------------------------------------------------------------
[advisories]
version = 2
# Yanked crates are flagged as warnings (not hard errors) so a yanked patch
# release in a transitive dep doesn't block the build unexpectedly.
yanked = "warn"
ignore = [
    # rsa 0.9.x has a timing side-channel in private-key operations (Marvin Attack).
    # No patch is available. Our exposure is read-only: sigstore-verification →
    # sigstore → openidconnect uses rsa only for JWT *signature verification*
    # (public-key operations), never decryption with a private key.  The attack
    # surface is therefore not present in ahma's execution path.
    { id = "RUSTSEC-2023-0071", reason = "rsa used for public-key JWT verify only via openidconnect; no private-key ops in this path; no fix available upstream" },

    # proc-macro-error 1.x is unmaintained. No fix available.
    # Pulled transitively: sigstore-verification → sigstore → json-syntax →
    # locspan-derive → proc-macro-error.  This is a build-time procedural macro
    # crate; it has no runtime attack surface.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is a build-time-only proc-macro dep via sigstore transitive chain; unmaintained but no runtime exposure; no fix available upstream" },

    # proc-macro-error2 is unmaintained. No fix available.
    # Pulled transitively: sigstore-verification → sigstore → oci-client →
    # oci-spec → getset → proc-macro-error2. This is a build-time procedural
    # macro crate; it has no runtime attack surface.
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is a build-time-only proc-macro dep via sigstore transitive chain; unmaintained but no runtime exposure; no fix available upstream" },

    # The following two advisories are both from AWS security bulletin 2026-019-AWS
    # and share the same upstream blocker: both are fixed in tough >= 0.22.0,
    # but sigstore 0.13.0 pins tough = "0.21" (^0.21 ⟹ < 0.22), and
    # sigstore-verification 0.2.8 requires sigstore ^0.13.  sigstore 0.14.0
    # (which uses tough ^0.22) is a breaking upgrade (signature ^2 → ^3) that
    # sigstore-verification has not yet adopted.
    # Exposure: tough is only exercised by the sigstore-trust-root feature during
    # artifact *verification* (read-only TUF root refresh). Exploitation of either
    # CVE requires the attacker to hold delegated TUF signing authority — well
    # outside ahma's threat model.
    # Track upstream: https://github.com/jdx/sigstore-verification/issues

    # CVE-2026-6967: missing expiration/hash/length checks on delegated targets
    # metadata allows an attacker with delegated write access to poison the local
    # metadata cache.
    { id = "GHSA-4v58-8p28-2rq3", reason = "tough 0.21 delegated-metadata integrity bypass; no fix available via sigstore-verification chain (sigstore 0.13 pins tough ^0.21, sigstore 0.14 breaking upgrade not yet adopted); read-only TUF use; exploitation requires delegated TUF write access" },

    # CVE-2026-6966: delegated-role signature threshold bypass via duplicate
    # signatures allows an actor with any valid signing key to satisfy the threshold
    # check alone and push forged delegated-role metadata.
    { id = "GHSA-8m7c-8m39-rv4x", reason = "tough 0.21 delegated-role signature-threshold bypass; same upstream blocker as GHSA-4v58-8p28-2rq3; no fix available until sigstore-verification adopts sigstore 0.14; read-only TUF use; exploitation requires a valid delegated signing key" },
]

# ---------------------------------------------------------------------------
# Licenses – explicit allowlist; anything unlisted is denied
# ---------------------------------------------------------------------------
[licenses]
# Permissive licences common in the Rust ecosystem
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception", # Rust stdlib / LLVM toolchain crates
    "MIT",
    "MIT-0",                          # dunce, aws-lc-sys (MIT No Attribution)
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",                        # ryu (Boost Software License)
    "MPL-2.0",                        # option-ext, rust-code-analysis (weak copyleft, file-level)
    "Unicode-3.0",                    # icu_* / unicode crates
    "CDLA-Permissive-2.0",            # webpki-root-certs, webpki-roots
    # First-party crates (ahma_bin, ahma_cluster, ahma_vault, etc.)
    "AGPL-3.0-or-later",
]

# ---------------------------------------------------------------------------
# Bans – flag duplicate crate versions; don't block wildcards
# ---------------------------------------------------------------------------
[bans]
# Warn (not deny) on multiple versions of the same crate; transitive dep
# upgrades often cause temporary duplication.
multiple-versions = "warn"
# Wildcard version requirements are usually fine in dev-dependencies.
wildcards = "allow"
# First-party per-crate license boundaries are enforced separately by
# `scripts/check-license-boundaries.sh`, because cargo-deny bans apply
# globally rather than by dependent crate.

# ---------------------------------------------------------------------------
# Sources – crates.io only (no git dependencies)
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
