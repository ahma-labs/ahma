[package]
authors.workspace = true
edition.workspace = true
license.workspace = true
name = "ahma_http_bridge"
description = "HTTP bridge that multiplexes MCP client sessions onto isolated ahma stdio subprocesses. Implements MCP Streamable HTTP (validates protocol revisions 2024-11-05 through 2025-11-25) with per-session sandbox isolation (MIT OR Apache-2.0)."
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
parking_lot.workspace = true
ahma_common = { path = "../ahma_common" }
anyhow.workspace = true
axum = { version = "0.8", features = ["http2", "tokio"] }
bytes = "1.12"
hyper = { version = "1", features = ["http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5" }
chrono.workspace = true
clap = { workspace = true, features = ["derive"] }
dashmap = "6.2"
futures.workspace = true
opentelemetry-otlp = { workspace = true }
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true }
owo-colors = "4.3"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
hmac.workspace = true
sha2.workspace = true
subtle.workspace = true
arc-swap = "1"
thiserror.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "process",
    "sync",
    "signal",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { workspace = true, features = ["io", "codec"] }
tower-http = { version = "0.7", features = ["trace", "cors", "set-header"] }
tower_governor = "0.8"

# QUIC / HTTP/3 support
base64 = "0.22"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http-body-util = "0.1"
quinn = "0.11"
rcgen = "0.14.8"
rustls = "0.23"
rustls-pki-types = "1"
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing.workspace = true
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
ahma_mcp = { path = "../ahma_mcp" }
ahma_test_support = { path = "../ahma_test_support" }
async-trait.workspace = true
dunce.workspace = true
futures.workspace = true
reqwest = { workspace = true, features = ["json", "stream", "http2", "http3"] }
serial_test = "3.5.0"
tempfile.workspace = true
# `test-util` provides `#[tokio::test(start_paused = true)]`, so a test can prove a
# multi-second shutdown grace period elapses without actually waiting for it.
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
urlencoding = "2.1"
