name: "CodeQL"

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  schedule:
    - cron: '30 4 * * 6' # Run weekly on Saturday at 04:30 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_MAX_RETRIES: 10
  CARGO_TERM_COLOR: always
  CARGO_PAGER: cat
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_NET_RETRY: 10
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: false
  RUSTFLAGS: -C debuginfo=0 --cfg reqwest_unstable
  RUST_BACKTRACE: 1
  IS_DEV_BUILD: "true"
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_MAX_SIZE: 2G
  SCCACHE_DIRECT: "true"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}
          persist-credentials: true

      - name: Get current day number
        id: day-number
        run: echo "day=$(date +%j)" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo registry and git
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.package-cache
            ~/.cargo/bin
          key: cargo-registry-codeql-${{ runner.os }}-${{ runner.arch }}-day${{ steps.day-number.outputs.day }}
          restore-keys: |
            cargo-registry-codeql-${{ runner.os }}-${{ runner.arch }}-
            cargo-registry-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache sccache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.0
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-codeql-${{ runner.os }}-${{ runner.arch }}-day${{ steps.day-number.outputs.day }}
          restore-keys: |
            sccache-codeql-${{ runner.os }}-${{ runner.arch }}-
            sccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          components: clippy, rustfmt, rust-src
          rustflags: ""
          cache: false

      - name: Configure deterministic tooling env
        run: |
          git config --global core.pager cat
          git config --global fetch.recurseSubmodules false
          {
            echo "PAGER=cat"
            echo "LC_ALL=C"
            echo "LANG=C"
          } >> "$GITHUB_ENV"

      - name: sccache-action
        uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e # v0.0.10

      - name: Run cargo check (Rust only)
        if: matrix.language == 'rust'
        run: cargo check --locked --all-targets

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
