name: "CodeQL"

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  schedule:
    - cron: '30 4 * * 6' # Run weekly on Saturday at 04:30 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_MAX_RETRIES: 10
  CARGO_TERM_COLOR: always
  CARGO_PAGER: cat
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_NET_RETRY: 10
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: false
  RUSTFLAGS: -C debuginfo=0 --cfg reqwest_unstable
  RUST_BACKTRACE: 1
  IS_DEV_BUILD: "true"
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  # `cargo check` emits metadata, not codegen, so this namespace is both disjoint from the test
  # matrix's and much smaller. See the caching strategy note at the top of build.yml for how the
  # per-family caps add up against the 10 GiB repo quota.
  SCCACHE_CACHE_SIZE: 600M
  SCCACHE_DIRECT: "true"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}
          persist-credentials: true

      # This workflow runs on BOTH push and pull_request, so the save below is gated on `push`.
      # A cache saved on a PR ref is visible only to that PR but bills against the repo-wide
      # 10 GiB quota and evicts main's entries -- see rule 1 in the caching strategy note at the
      # top of build.yml. Restores are unconditional: PRs consume main's cache freely.
      - name: Restore Cargo registry and git
        if: matrix.language == 'rust'
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore sccache
        id: sccache
        if: matrix.language == 'rust'
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-codeql-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sccache-codeql-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-
            sccache-codeql-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Rust Toolchain
        if: matrix.language == 'rust'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt, rust-src
          rustflags: ""
          cache: false

      - name: Configure deterministic tooling env
        if: matrix.language == 'rust'
        run: |
          git config --global core.pager cat
          git config --global fetch.recurseSubmodules false
          {
            echo "PAGER=cat"
            echo "LC_ALL=C"
            echo "LANG=C"
          } >> "$GITHUB_ENV"

      - name: Install sccache
        if: matrix.language == 'rust'
        uses: taiki-e/install-action@v2
        with:
          tool: sccache

      - name: Run cargo check (Rust only)
        if: matrix.language == 'rust'
        run: cargo check --locked --all-targets

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

      - name: Show sccache stats
        if: always() && matrix.language == 'rust'
        run: |
          sccache --show-stats || true

      - name: Stop sccache server
        if: always() && matrix.language == 'rust'
        run: sccache --stop-server || true

      # Push-only, per the note on the restore steps above. The registry cache has no save step
      # at all in this workflow: build.yml's jobs run on the same push and write it there.
      - name: Save sccache
        if: always() && matrix.language == 'rust' && github.event_name == 'push'
        continue-on-error: true # a cache save must never redden a green job
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.sccache
          key: ${{ steps.sccache.outputs.cache-primary-key }}
