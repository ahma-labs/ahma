name: "CodeQL"

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  schedule:
    - cron: '30 4 * * 6' # Run weekly on Saturday at 04:30 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_MAX_RETRIES: 10
  CARGO_TERM_COLOR: always
  CARGO_PAGER: cat
  CARGO_INCREMENTAL: 0
  # Both profile lines must stay equal to each other and to build.yml (see the note there).
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_NET_RETRY: 10
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: false
  RUSTFLAGS: -C debuginfo=0 --cfg reqwest_unstable
  RUST_BACKTRACE: 1
  IS_DEV_BUILD: "true"
  RUSTC_WRAPPER: sccache
  SCCACHE_DIRECT: "true"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}
          persist-credentials: true

      # This workflow runs on BOTH push and pull_request, so the save below is gated on `push`.
      # A cache saved on a PR ref is visible only to that PR but bills against the repo-wide
      # 10 GiB quota and evicts main's entries -- see rule 1 in the caching strategy note at the
      # top of build.yml. Restores are unconditional: PRs consume main's cache freely.
      - name: Restore Cargo registry and git
        if: matrix.language == 'rust'
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Rust Toolchain
        if: matrix.language == 'rust'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt, rust-src
          rustflags: ""
          cache: false

      # ghac replaces the sccache tarball here too, and this tier is READ-ONLY on every trigger.
      #
      # On `pull_request` that is rule 1 above expressed as configuration rather than as the
      # convention of gating a save step on `push`: a PR run reads main's objects and writes
      # nothing, because sccache itself refuses to write in READ_ONLY.
      #
      # On `push` it is the write-contention decision recorded in build.yml's caching note. This
      # workflow runs concurrently with build.yml's matrix on the same push, against a ghac rate
      # limit that is shared by every job in the run. `cargo check` emits metadata, so its objects
      # share no key with anything the matrix builds -- these writes cost the matrix headroom and
      # can never serve it. CodeQL gives up its own hit rate (it now compiles cold every run) so
      # the legs that gate the release do not.
      - name: Set up sccache (ghac)
        if: matrix.language == 'rust'
        uses: ./.github/actions/sccache-ghac
        with:
          mode: read-only

      - name: Configure deterministic tooling env
        if: matrix.language == 'rust'
        run: |
          git config --global core.pager cat
          git config --global fetch.recurseSubmodules false
          {
            echo "PAGER=cat"
            echo "LC_ALL=C"
            echo "LANG=C"
          } >> "$GITHUB_ENV"

      - name: Run cargo check (Rust only)
        if: matrix.language == 'rust'
        run: cargo check --locked --all-targets

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

      # Nothing to stop or save: ghac awaits each write inside the compile request. The registry
      # cache still has no save step in this workflow -- build.yml's jobs run on the same push
      # and write it there.
      - name: Verify sccache (ghac)
        if: always() && matrix.language == 'rust'
        uses: ./.github/actions/sccache-verify
        with:
          label: CodeQL (cargo check)
