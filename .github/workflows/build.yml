name: Ahma
permissions:
  contents: read
  pages: write
  id-token: write
# Heavy use of multi-layer caching to speed builds
# Github Actions caches grow since they do not forget unused files from old versions
#
# We rotate to a new cache every day, loading from the previous day's cache and
# then saving the fresh cache only containing the current files. We also work off of
# the 'main' banch. Github caching has special rules to fall back to 'main' from
# other branches. We also do not make new caches with every push to reduce clutter.
# There is an inherent performance tradeoff with this approach between slowly making
# new caches frequently (for example if we build new caches each time the git hash
# changes) and caches being too stupid to save updates if the name has not changed,
# thus forcing re-builds of any changes for the rest of the current day. Daily cache
# rotation is a good compromise.
#
# Caches still grow and slow things down. Run the following from command line if you
# want to delete caches, perhaps different types at different times:
#   gh cache delete --all
#   gh cache delete cargo-
#   gh cache delete sccache-
#   gh cache delete gradle-
#
# Avoid pull requests- they cause needless double builds. Instead rebase from 'main'
# to your branch to give priority to your changes. Then rebase from your branch back
# to 'main', test, then push.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  workflow_dispatch:
    inputs:
      action:
        description: 'Key management action (generate-signing-key rotates the release keypair entirely inside GitHub Actions — no local machine involved)'
        required: true
        type: choice
        options:
          - generate-signing-key

env:
  RUSTUP_MAX_RETRIES: 10
  CARGO_TERM_COLOR: always
  CARGO_PAGER: cat
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_NET_RETRY: 10
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: false
  RUSTFLAGS: -C debuginfo=0 --cfg reqwest_unstable # Do not produce debug symbols; enable HTTP/3 (QUIC) in reqwest
  RUST_BACKTRACE: 1
  IS_DEV_BUILD: "true" # Set "true" to speed up builds for CI testing
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_MAX_SIZE: 2G
  SCCACHE_DIRECT: "true"
jobs:
  job-cargo-nextest:
    name: Cargo Nextest (${{ matrix.os }})
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}
          persist-credentials: true

      - name: Configure Windows Defender exclusions
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionPath "$env:TEMP"

      - name: Get current day number
        id: day-number
        run: echo "day=$(date +%j)" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo registry and git
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.package-cache
            ~/.cargo/bin
          key: cargo-registry-test-${{ runner.os }}-${{ runner.arch }}-day${{ steps.day-number.outputs.day }}
          restore-keys: |
            cargo-registry-test-${{ runner.os }}-${{ runner.arch }}-
            cargo-registry-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache sccache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.0
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-test-${{ runner.os }}-${{ runner.arch }}-day${{ steps.day-number.outputs.day }}
          restore-keys: |
            sccache-test-${{ runner.os }}-${{ runner.arch }}-
            sccache-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          components: clippy, rustfmt
          rustflags: ""
          cache: false

      - name: Configure deterministic tooling env
        run: |
          git config --global core.pager cat
          git config --global fetch.recurseSubmodules false
          {
            echo "PAGER=cat"
            echo "LC_ALL=C"
            echo "LANG=C"
          } >> "$GITHUB_ENV"

      - name: Preflight workspace crate roots
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r manifest; do
            crate_dir="$(dirname "$manifest")"
            # Workspace root manifests may not define a package.
            if ! grep -q "^\[package\]" "$manifest"; then
              continue
            fi
            if [ ! -f "$crate_dir/src/lib.rs" ] && [ ! -f "$crate_dir/src/main.rs" ]; then
              echo "Missing crate root in $crate_dir (expected src/lib.rs or src/main.rs)"
              missing=1
            fi
          done < <(find . -name Cargo.toml -not -path "./target/*")

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Preflight failed: one or more crates are missing source roots."
            echo "This often happens when required files exist locally but are untracked."
            exit 1
          fi

      - name: sccache-action
        uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e # v0.0.10

      - name: Install cargo-nextest
        uses: taiki-e/install-action@50b4a718b59c718df4ef27a3b445f86cd57b9f00 # v2
        with:
          tool: nextest

      - name: Add Cargo Bin to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build ahma binary (required by integration tests)
        run: cargo build --locked --no-default-features -p ahma_bin

      - name: Cargo Nextest (excluding Android/Kotlin tests)
        timeout-minutes: 40
        run: |
          echo "--- cargo --version" && cargo --version
          echo "--- cargo nextest --version" && cargo nextest --version
          echo "--- Running cargo nextest run --profile ci"
          # Exclude kotlin/android tests - they run in job-android-nextest only
          cargo nextest run --profile ci --locked --no-default-features -E 'not (test(kotlin) or test(android))'

      - name: Cargo Clippy
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: cargo clippy --locked

      - name: Cargo Clippy (no-default-features)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: cargo clippy --no-default-features --locked

      - name: Cargo Clippy Tests
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: cargo clippy --tests --locked

      - name: Cargo Doc
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: cargo doc --no-deps

      - name: Upload documentation
        if: runner.os == 'Linux' && runner.arch == 'X64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: documentation
          path: target/doc

      - name: Show sccache stats
        run: sccache --show-stats

  #######################################

  job-security:
    name: Security (cargo deny)
    runs-on: ubuntu-latest
    # Run on every push and PR to every branch for earliest CVE detection.
    # This job is intentionally independent of the test matrix.
    env:
      RUSTC_WRAPPER: "" # cargo-deny runs in Docker without sccache; unset the workflow-level wrapper
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
          persist-credentials: true

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@8f84122a46a358a27cb0625d85ad60ab436a1b87 # v2.0.5
        with:
          # Check all four categories: advisories, licenses, bans, sources
          command: check
          # Point at our deny.toml at the workspace root
          manifest-path: Cargo.toml

      - name: Check workspace license boundaries
        run: bash ./scripts/check-license-boundaries.sh

  #######################################

  job-android-nextest:
    name: Android Nextest
    runs-on: macos-latest
    env:
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.0

      - name: Get current day number
        id: day-number
        run: echo "day=$(date +%j)" >> "$GITHUB_OUTPUT"

      - name: Cache AGP and more Gradle directories
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-*
            ~/.gradle/caches/transforms-*
            ~/.gradle/caches/build-cache-*
            ~/.gradle/daemon
            ~/.gradle/wrapper
          key: gradle-deeper-android-${{ runner.os }}-day${{ steps.day-number.outputs.day }}
          restore-keys: |
            gradle-deeper-android-${{ runner.os }}-

      - name: Cache Cargo registry and git
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.package-cache
            ~/.cargo/bin
          key: cargo-registry-android-${{ runner.os }}-${{ runner.arch }}-day${{ steps.day-number.outputs.day }}
          restore-keys: |
            cargo-registry-android-${{ runner.os }}-${{ runner.arch }}-
            cargo-registry-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache sccache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.0
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-android-${{ runner.os }}-${{ runner.arch }}-day${{ steps.day-number.outputs.day }}
          restore-keys: |
            sccache-android-${{ runner.os }}-${{ runner.arch }}-
            sccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Android build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.0
        with:
          path: |
            ${{ github.workspace }}/.gradle
            ${{ runner.tool_cache }}/gradle
            ./test-data/AndoidTestBasicViews/.gradle
            ./test-data/AndoidTestBasicViews/app/build/intermediates
            ./test-data/AndoidTestBasicViews/app/build/outputs
            ./test-data/AndoidTestBasicViews/app/build/kotlin
            ./test-data/AndoidTestBasicViews/app/build/generated
            ./test-data/AndoidTestBasicViews/app/build/kspCaches
            ./test-data/AndoidTestBasicViews/app/build/tmp
            ./test-data/AndoidTestBasicViews/build/kotlin
            ./test-data/AndoidTestBasicViews/build/intermediates
          key: gradle-android-build-${{ runner.os }}-day${{ steps.day-number.outputs.day }}
          restore-keys: |
            gradle-android-build-${{ runner.os }}-

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          rustflags: ""
          cache: false

      - name: sccache-action
        uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e # v0.0.10

      - name: Install cargo-nextest and cargo-ndk
        uses: taiki-e/install-action@50b4a718b59c718df4ef27a3b445f86cd57b9f00 # v2
        with:
          tool: nextest,cargo-ndk

      - name: Add Cargo Bin to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Run Android/Kotlin nextest only
        run: |
          # Run ONLY kotlin/android tests (feature-gated and name-filtered for clarity)
          cargo nextest run --profile ci --locked -p ahma_mcp --features android -E 'test(kotlin) or test(android)'

      - name: Show sccache stats
        run: sccache --show-stats

  #######################################

  job-coverage:
    runs-on: ubuntu-latest
    # Only run on main branch pushes, not pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}
          persist-credentials: true

      - name: Get current day number
        id: day-number
        run: echo "day=$(date +%j)" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo registry and git
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.package-cache
            ~/.cargo/bin
          key: cargo-registry-coverage-${{ runner.os }}-${{ runner.arch }}-day${{ steps.day-number.outputs.day }}
          restore-keys: |
            cargo-registry-coverage-${{ runner.os }}-${{ runner.arch }}-
            cargo-registry-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache sccache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.0
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-coverage-${{ runner.os }}-${{ runner.arch }}-day${{ steps.day-number.outputs.day }}
          restore-keys: |
            sccache-coverage-${{ runner.os }}-${{ runner.arch }}-
            sccache-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          components: llvm-tools-preview
          rustflags: ""
          cache: false

      - name: Configure deterministic tooling env
        run: |
          git config --global core.pager cat
          git config --global fetch.recurseSubmodules false
          {
            echo "PAGER=cat"
            echo "LC_ALL=C"
            echo "LANG=C"
          } >> "$GITHUB_ENV"

      - name: sccache-action
        uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e # v0.0.10

      - name: Install cargo-nextest, cargo-ndk, and cargo-llvm-cov
        uses: taiki-e/install-action@50b4a718b59c718df4ef27a3b445f86cd57b9f00 # v2
        with:
          tool: nextest,cargo-ndk,cargo-llvm-cov

      - name: Build ahma binary (required by integration tests)
        run: cargo build --locked --no-default-features -p ahma_bin

      - name: Generate coverage report
        timeout-minutes: 40
        run: |
          cargo llvm-cov nextest --profile coverage --locked --no-default-features --html --output-dir ./coverage -E 'not (test(kotlin) or test(android))'

      - name: Generate code simplicity report
        run: |
          cargo run -p ahma_bin -- simplify . --limit 20 --html
          cp CODE_SIMPLICITY.md coverage/
          cp CODE_SIMPLICITY.html coverage/

      - name: Generate Rust Docs
        run: |
          cargo doc --no-deps
          cp -r target/doc coverage/
          echo '<meta http-equiv="refresh" content="0; url=ahma_mcp/index.html">' > coverage/doc/index.html

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload coverage artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./coverage

      - name: Upload code simplicity report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: code-simplicity-report
          path: ./coverage/CODE_SIMPLICITY.md

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Show sccache stats
        run: sccache --show-stats

  #######################################

  job-release-binaries:
    name: Release Binaries (${{ matrix.platform }})
    # Run only on main branch pushes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          # Native builds (no cross-compilation needed)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            use_cross: false
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-arm64
            use_cross: false
          # Windows native build
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            use_cross: false
          # Cross-compiled musl builds (portable, no glibc dependency)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x86_64-musl
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            platform: linux-arm64-musl
            use_cross: true
          # Cross-compiled ARM 32-bit (Raspberry Pi 2/3)
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            platform: linux-armv7
            use_cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}
          persist-credentials: true

      - name: Configure Windows Defender exclusions
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionPath "$env:TEMP"

      - name: Get current day number
        id: day-number
        run: echo "day=$(date +%j)" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo registry and git
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.package-cache
            ~/.cargo/bin
          key: cargo-registry-release-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-day${{ steps.day-number.outputs.day }}
          restore-keys: |
            cargo-registry-release-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-
            cargo-registry-release-${{ runner.os }}-${{ runner.arch }}-
            cargo-registry-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache sccache
        if: "!matrix.use_cross"
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.0
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-release-${{ matrix.platform }}-day${{ steps.day-number.outputs.day }}
          restore-keys: |
            sccache-release-${{ matrix.platform }}-day
            sccache-release-${{ matrix.platform }}-

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          target: ${{ matrix.target }}
          rustflags: ""
          cache: false

      - name: Configure deterministic tooling env
        run: |
          git config --global core.pager cat
          git config --global fetch.recurseSubmodules false
          {
            echo "PAGER=cat"
            echo "LC_ALL=C"
            echo "LANG=C"
          } >> "$GITHUB_ENV"

      - name: Preflight workspace crate roots
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r manifest; do
            crate_dir="$(dirname "$manifest")"
            # Workspace root manifests may not define a package.
            if ! grep -q "^\[package\]" "$manifest"; then
              continue
            fi
            if [ ! -f "$crate_dir/src/lib.rs" ] && [ ! -f "$crate_dir/src/main.rs" ]; then
              echo "Missing crate root in $crate_dir (expected src/lib.rs or src/main.rs)"
              missing=1
            fi
          done < <(find . -name Cargo.toml -not -path "./target/*")

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Preflight failed: one or more crates are missing source roots."
            echo "This often happens when required files exist locally but are untracked."
            exit 1
          fi

      - name: sccache-action
        if: "!matrix.use_cross"
        uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e # v0.0.10

      - name: Install cross (for cross-compilation)
        if: matrix.use_cross
        uses: taiki-e/install-action@50b4a718b59c718df4ef27a3b445f86cd57b9f00 # v2
        with:
          tool: cross

      - name: Build release binaries (native)
        if: "!matrix.use_cross"
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p ahma_bin

      - name: Build release binaries (cross-compiled)
        if: matrix.use_cross
        run: |
          # Disable sccache for cross builds (incompatible with cross's Docker containers)
          unset RUSTC_WRAPPER
          cross build --release --locked --target ${{ matrix.target }} -p ahma_bin

      - name: Package release binaries
        id: package
        run: |
          set -euo pipefail
          platform="${{ matrix.platform }}"
          mkdir -p dist
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            archive_name="ahma-release-${platform}.zip"
            cp "target/${{ matrix.target }}/release/ahma.exe" dist/
            cp README.md dist/
            (cd dist && sha256sum ahma.exe > SHA256SUMS)
            (cd dist && 7z a "../${archive_name}" ahma.exe SHA256SUMS README.md)
          else
            archive_name="ahma-release-${platform}.tar.gz"
            cp target/${{ matrix.target }}/release/ahma dist/
            cp README.md dist/
            (cd dist && shasum -a 256 ahma > SHA256SUMS)
            tar -czf "$archive_name" -C dist ahma SHA256SUMS README.md
          fi
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"

      - name: Upload release binaries artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: release-binaries-${{ matrix.platform }}
          path: ${{ steps.package.outputs.archive_name }}

      - name: Show sccache stats
        if: "!matrix.use_cross"
        run: sccache --show-stats

  #######################################

  job-publish-release:
    name: Publish Release
    needs:
      - job-cargo-nextest
      - job-android-nextest
      - job-release-binaries
      - job-coverage
      - job-security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
          persist-credentials: true

      - name: Download all release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-binaries-*
          merge-multiple: true

      - name: Generate combined SHA256SUMS
        env:
          AHMA_RELEASE_SIGNING_KEY: ${{ secrets.AHMA_RELEASE_SIGNING_KEY }}
        run: |
          # 1. Produce a single SHA256SUMS file covering every release archive.
          sha256sum ahma-release-*.tar.gz ahma-release-*.zip > SHA256SUMS

          # 2. Extract the individual binary hashes from the archives and append them
          # to the combined SHA256SUMS file. This allows verifying the installed binary
          # directly without downloading the archive again.
          echo "" >> SHA256SUMS
          echo "# Raw Binaries" >> SHA256SUMS
          for f in ahma-release-*.tar.gz; do
            if [ -f "$f" ]; then
              platform=$(echo "$f" | sed -E 's/ahma-release-(.*)\.tar\.gz/\1/')
              hash=$(tar -xOf "$f" SHA256SUMS | grep -E "ahma$" | head -n 1 | awk '{print $1}')
              echo "$hash  ahma-${platform}" >> SHA256SUMS
            fi
          done
          for f in ahma-release-*.zip; do
            if [ -f "$f" ]; then
              platform=$(echo "$f" | sed -E 's/ahma-release-(.*)\.zip/\1/')
              hash=$(unzip -p "$f" SHA256SUMS | grep "ahma.exe" | head -n 1 | awk '{print $1}')
              echo "$hash  ahma-${platform}.exe" >> SHA256SUMS
            fi
          done

          echo "Combined SHA256SUMS contents:"
          cat SHA256SUMS

          # 3. Cryptographically sign the checksums file
          # Hard-fail if the secret is absent — a release without a real signature must never reach users.
          if [ -z "${AHMA_RELEASE_SIGNING_KEY:-}" ]; then
            echo "::error::AHMA_RELEASE_SIGNING_KEY secret is not set. Cannot publish a signed release."
            echo "::error::Trigger the 'generate-signing-key' workflow_dispatch action to create a new keypair entirely inside GitHub Actions."
            echo "::error::No private key ever needs to touch a developer machine."
            exit 1
          fi
          echo "Signing SHA256SUMS..."
          echo "$AHMA_RELEASE_SIGNING_KEY" > release_key.pem
          openssl dgst -sha256 -sign release_key.pem -out SHA256SUMS.sig SHA256SUMS
          rm -f release_key.pem

      - name: Determine release tag
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed -E 's/^version = "(.*)"/\1/')
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # Skip if this exact version was already published
          if gh release view "${TAG}" --json tagName > /dev/null 2>&1; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} already exists — skipping."
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        if: steps.version.outputs.already_released == 'false'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            ## Ahma ${{ steps.version.outputs.tag }}

            Built from [`main`](https://github.com/paulirotta/ahma/tree/main) via the [CI pipeline](https://github.com/paulirotta/ahma/actions/workflows/build.yml).

            ### Install

            **Linux / macOS:**
            ```bash
            curl -sSf https://raw.githubusercontent.com/paulirotta/ahma/main/scripts/install.sh | bash
            export PATH="$HOME/.local/bin:$PATH"
            ```

            **Windows (PowerShell 5.1+):**
            ```powershell
            irm https://raw.githubusercontent.com/paulirotta/ahma/main/scripts/install.ps1 | iex
            ```

            **Update an existing install:**
            ```bash
            ahma update
            ```

            ### Signed binaries — supply chain protection

            Every release archive and raw binary is covered by a **cryptographically signed manifest**.

            - `SHA256SUMS` — SHA-256 hashes of all assets and extracted binaries
            - `SHA256SUMS.sig` — RSA-2048 / PKCS#1v15 / SHA-256 signature

            The signing key is held exclusively in GitHub Actions secrets. It never exists on any
            developer machine. The installers above verify the signature automatically before writing
            anything to disk:
            ```
            Authenticity verified: Release signature is valid.
            ```

            **Manual spot-check:**
            ```bash
            curl -sSfL https://github.com/paulirotta/ahma/releases/download/${{ steps.version.outputs.tag }}/SHA256SUMS -o /tmp/SHA256SUMS
            curl -sSfL https://github.com/paulirotta/ahma/releases/download/${{ steps.version.outputs.tag }}/SHA256SUMS.sig -o /tmp/SHA256SUMS.sig
            openssl dgst -sha256 -verify scripts/ahma-release.pub.pem -signature /tmp/SHA256SUMS.sig /tmp/SHA256SUMS
            # → Verified OK
            ```

            ### AGPL + signing: two-layer supply chain defence

            The `ahma` binary and security-relevant crates are **AGPL-3.0-or-later**.
            AGPL requires source disclosure for any distributed or network-accessible modification,
            closing the route of shipping a backdoored binary without publishing the changes.
            Binary signing verifies that what you install came from the published, auditable source
            via the official CI pipeline — making an unsigned or differently-signed impostor
            immediately detectable.

            Building from auditable source is always an option:
            ```bash
            cargo install --git https://github.com/paulirotta/ahma ahma_bin --bin ahma --root ~/.local --locked
            ```

            See [docs/release-signing.md](https://github.com/paulirotta/ahma/blob/main/docs/release-signing.md)
            for the full signing architecture and key rotation procedure.
          draft: false
          prerelease: false
          make_latest: "true"
          files: |
            ahma-release-*.tar.gz
            ahma-release-*.zip
            SHA256SUMS
            SHA256SUMS.sig

      - name: Verify published release signature
        if: steps.version.outputs.already_released == 'false'
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          BASE="https://github.com/paulirotta/ahma/releases/download/${TAG}"
          echo "Downloading published SHA256SUMS and signature for post-publish verification..."
          # Retry a few times — GitHub CDN can be slow to propagate
          for i in 1 2 3 4 5; do
            sleep 10
            if curl -sSfL "${BASE}/SHA256SUMS" -o /tmp/SHA256SUMS && \
               curl -sSfL "${BASE}/SHA256SUMS.sig" -o /tmp/SHA256SUMS.sig; then
              break
            fi
            echo "Attempt ${i}/5 failed, retrying..."
          done
          # Verify using the committed public key — automatically stays current after key rotation
          openssl dgst -sha256 -verify scripts/ahma-release.pub.pem \
            -signature /tmp/SHA256SUMS.sig /tmp/SHA256SUMS
          echo "Post-publish signature verification: PASSED"

  # --------------------------------------------------------------------------
  # Publish to Windows Package Manager (winget-pkgs)
  # Runs after a successful release publish on main.
  # Requires repository secret WINGET_TOKEN (GitHub PAT with winget-pkgs write
  # access).  If the secret is absent the job skips gracefully.
  # --------------------------------------------------------------------------
  job-publish-winget:
    name: Publish Winget Manifest
    needs: [job-publish-release]
    # Enable by defining repository variable WINGET_PUBLISH_ENABLED=true.
    if: ${{ vars.WINGET_PUBLISH_ENABLED == 'true' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
          persist-credentials: true

      - name: Install wingetcreate
        shell: powershell
        run: |
          # winget is available on windows-latest but can be flaky on CI.
          # Download wingetcreate directly as a fallback to ensure reliability.
          $url = 'https://aka.ms/wingetcreate/latest'
          Invoke-WebRequest -Uri $url -OutFile wingetcreate.exe -UseBasicParsing
          Move-Item wingetcreate.exe "$env:LOCALAPPDATA\Microsoft\WindowsApps\wingetcreate.exe" -Force
          wingetcreate --version

      - name: Publish winget manifest
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "${WINGET_TOKEN:-}" ]; then
            echo "WINGET_TOKEN secret not set — skipping winget publish."
            echo "Set the secret to enable automatic winget-pkgs PR submission."
            exit 0
          fi
          chmod +x scripts/publish-winget.sh
          ./scripts/publish-winget.sh

  # --------------------------------------------------------------------------
  # Key Management — Generate / Rotate Release Signing Keypair
  #
  # Triggered manually via: Actions → Run workflow → action: generate-signing-key
  #
  # Security model:
  #   - Keypair is generated entirely on an ephemeral Ubuntu runner (tmpfs)
  #   - Private key is uploaded as a 1-day admin-only artifact, then shredded
  #   - Public key changes are committed to a branch and a PR is opened
  #   - Operator: downloads artifact → sets AHMA_RELEASE_SIGNING_KEY secret → merges PR
  #   - Private key NEVER touches any developer machine
  # --------------------------------------------------------------------------
  job-generate-signing-key:
    name: Generate / Rotate Release Signing Key
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'generate-signing-key'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Generate RSA-2048 keypair on ephemeral runner
        id: keygen
        run: |
          set -euo pipefail
          DATESTAMP=$(date +%Y%m%d)
          echo "datestamp=${DATESTAMP}" >> "$GITHUB_OUTPUT"

          # Generate private key into tmpfs (RAM-backed on Linux)
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out /tmp/release_key.pem 2>/dev/null

          # Extract public key in PEM format
          openssl rsa -pubout -in /tmp/release_key.pem \
            -out /tmp/ahma-release.pub.pem 2>/dev/null

          # Extract public key in XML format (for Windows installer)
          # openssl rsa -modulus gives the hex modulus reliably; exponent is always 65537 for RSA-2048
          python3 - <<'PYEOF'
          import subprocess, base64, sys

          # Extract modulus hex via openssl — format: "Modulus=AABB..."
          result = subprocess.run(
              ["openssl", "rsa", "-pubin", "-in", "/tmp/ahma-release.pub.pem",
               "-modulus", "-noout"],
              capture_output=True, text=True
          )
          if result.returncode != 0:
              print("ERROR: openssl rsa -modulus failed:", result.stderr, file=sys.stderr)
              sys.exit(1)

          mod_hex = result.stdout.strip().split("=")[1]
          # Strip leading 00 sign byte if present
          if mod_hex.startswith("00"):
              mod_hex = mod_hex[2:]

          mod_b64 = base64.b64encode(bytes.fromhex(mod_hex)).decode()

          # RSA public exponent is always 65537 = 0x010001
          exp_b64 = base64.b64encode(bytes.fromhex("010001")).decode()

          xml = f'<RSAKeyValue><Modulus>{mod_b64}</Modulus><Exponent>{exp_b64}</Exponent></RSAKeyValue>'
          with open("/tmp/ahma-release.pub.xml", "w") as f:
              f.write(xml + "\n")
          print(f"XML key written successfully ({len(xml)} chars)")
          PYEOF

          echo "Keypair generated successfully."
          echo "Public key (PEM):"
          cat /tmp/ahma-release.pub.pem

      - name: Update all embedded public-key locations
        run: |
          set -euo pipefail

          # 1. Public key file
          cp /tmp/ahma-release.pub.pem scripts/ahma-release.pub.pem
          cp /tmp/ahma-release.pub.xml scripts/ahma-release.pub.xml

          # 2. install.sh — replace the PUB_KEY_PEM= block
          # The block spans from '# Public key for release verification' to the closing '"'
          NEW_PEM=$(cat /tmp/ahma-release.pub.pem)
          python3 - <<PYEOF
          import re

          with open("scripts/install.sh", "r") as f:
              content = f.read()

          # Match: PUB_KEY_PEM="-----BEGIN PUBLIC KEY-----\n...\n-----END PUBLIC KEY-----"
          pattern = r'(PUB_KEY_PEM=")-----BEGIN PUBLIC KEY-----[\s\S]*?-----END PUBLIC KEY-----(")'
          new_pem = open("/tmp/ahma-release.pub.pem").read().strip()
          replacement = r'\g<1>' + new_pem + r'\g<2>'
          new_content = re.sub(pattern, replacement, content)

          if new_content == content:
              raise ValueError("PUB_KEY_PEM block not found in install.sh — pattern mismatch")

          with open("scripts/install.sh", "w") as f:
              f.write(new_content)
          print("install.sh updated")
          PYEOF

          # 3. install.ps1 — replace the $PUB_KEY_XML line
          NEW_XML=$(cat /tmp/ahma-release.pub.xml | tr -d '\n')
          python3 - <<PYEOF
          import re

          with open("scripts/install.ps1", "r") as f:
              content = f.read()

          new_xml = open("/tmp/ahma-release.pub.xml").read().strip()
          pattern = r'(\$PUB_KEY_XML = )(\x27[^\x27]*\x27)'
          replacement = r"\g<1>'" + new_xml + "'"
          new_content = re.sub(pattern, replacement, content)

          if new_content == content:
              raise ValueError("$PUB_KEY_XML line not found in install.ps1 — pattern mismatch")

          with open("scripts/install.ps1", "w") as f:
              f.write(new_content)
          print("install.ps1 updated")
          PYEOF

          # 4. ahma_mcp/src/update/install.rs — replace const PUB_KEY_PEM block
          python3 - <<PYEOF
          import re

          with open("ahma_mcp/src/update/install.rs", "r") as f:
              content = f.read()

          new_pem = open("/tmp/ahma-release.pub.pem").read().strip()
          pattern = r'(const PUB_KEY_PEM: &str = ")-----BEGIN PUBLIC KEY-----[\s\S]*?-----END PUBLIC KEY-----(";)'
          replacement = r'\g<1>' + new_pem + r'\g<2>'
          new_content = re.sub(pattern, replacement, content)

          if new_content == content:
              raise ValueError("const PUB_KEY_PEM block not found in install.rs — pattern mismatch")

          with open("ahma_mcp/src/update/install.rs", "w") as f:
              f.write(new_content)
          print("install.rs updated")
          PYEOF

          echo "All embedded public-key locations updated."

      - name: Upload private key artifact (admin-only, expires 24h)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: signing-key-${{ steps.keygen.outputs.datestamp }}-${{ github.run_id }}
          path: /tmp/release_key.pem
          retention-days: 1
          # Note: only repository admins can download workflow artifacts

      - name: Shred private key from runner tmpfs
        if: always()
        run: |
          if [ -f /tmp/release_key.pem ]; then
            # Overwrite with random bytes before deletion
            KEY_SIZE=$(stat -c%s /tmp/release_key.pem)
            dd if=/dev/urandom of=/tmp/release_key.pem bs=1 count="${KEY_SIZE}" conv=notrunc 2>/dev/null
            rm -f /tmp/release_key.pem
            echo "Private key shredded from runner."
          fi

      - name: Commit public-key changes and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATESTAMP="${{ steps.keygen.outputs.datestamp }}"
          BRANCH="chore/rotate-signing-key-${DATESTAMP}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "${BRANCH}"
          git add scripts/ahma-release.pub.pem \
                  scripts/ahma-release.pub.xml \
                  scripts/install.sh \
                  scripts/install.ps1 \
                  ahma_mcp/src/update/install.rs
          git commit -m "chore(security): rotate release signing key ${DATESTAMP}"
          git push origin "${BRANCH}"

          gh pr create \
            --title "chore(security): rotate release signing key ${DATESTAMP}" \
            --body "$(cat <<PRBODY
          ## Release Signing Key Rotation

          This PR was auto-generated by the \`generate-signing-key\` workflow.

          ### What changed
          - \`scripts/ahma-release.pub.pem\` — new RSA-2048 public key
          - \`scripts/ahma-release.pub.xml\` — XML form for Windows installer
          - \`scripts/install.sh\` — updated embedded \`PUB_KEY_PEM\`
          - \`scripts/install.ps1\` — updated embedded \`\$PUB_KEY_XML\`
          - \`ahma_mcp/src/update/install.rs\` — updated \`const PUB_KEY_PEM\`

          ### Required operator action before merging
          1. Download artifact \`signing-key-${DATESTAMP}-${{ github.run_id }}\` from this workflow run (expires in 24h — act promptly)
          2. Go to **Settings → Secrets and variables → Actions → \`AHMA_RELEASE_SIGNING_KEY\`** → Update
          3. Paste the contents of the downloaded \`release_key.pem\`
          4. Delete the downloaded file from your machine
          5. Merge this PR
          6. Record the rotation in \`docs/release-signing.md\` Key Rotation Log

          See [docs/release-signing.md](docs/release-signing.md) for the full rotation SOP.
          PRBODY
          )" \
            --base main \
            --head "${BRANCH}"

      - name: Write operator instructions to job summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'SUMMARY'
          ## Signing Key Rotation — Next Steps

          The new keypair has been generated entirely inside this ephemeral runner.

          ### You must do the following within **24 hours** (artifact expiry):

          1. **Download the private key artifact** from this workflow run
             (only repository admins can download artifacts)
          2. **Update the GitHub secret**: Settings → Secrets and variables → Actions → `AHMA_RELEASE_SIGNING_KEY` → Update
          3. **Paste the contents** of `release_key.pem` as the new secret value
          4. **Permanently delete** the downloaded `release_key.pem` from your machine
          5. **Merge the auto-generated PR** (public keys updated in all code locations)
          6. **Verify** the next release CI run shows "Post-publish signature verification: PASSED"
          7. **Record the rotation** in `docs/release-signing.md` Key Rotation Log

          ### Security reminder
          The private key never existed outside this ephemeral runner and the artifact.
          It was shredded from runner tmpfs after upload.
          SUMMARY
