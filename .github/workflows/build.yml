name: Ahma
permissions:
  contents: read
  pages: write
  id-token: write
# CACHING STRATEGY
#
# The repo-wide Actions cache quota is 10 GiB, LRU-evicted. Every byte a job saves competes with
# every other job, so the design constraint is a *steady-state footprint*, not a per-job hit rate.
#
# Compilation caching is sccache on its native GitHub Actions backend ("ghac",
# SCCACHE_GHA_ENABLED). Each compilation object is its own Actions cache entry, written as it is
# produced. There is no tarball of SCCACHE_DIR, no restore/save step pair, no per-run cache key
# and no janitor: an object nothing reads is evicted by GitHub's LRU, and per-object LRU stores
# the live set instead of a snapshot plus its accumulated dead weight.
#
# Set up with the `.github/actions/sccache-ghac` composite action and verified with
# `.github/actions/sccache-verify`. Both are shared by every job here and in codeql.yml /
# fast-tier.yml, deliberately: ghac is switched on in exactly one place, and every job that
# switches it on also asserts that it took effect.
#
# That sharing is not just tidiness -- it is what makes the jobs share a cache at all. sccache
# namespaces its ghac objects as `sccache-v{VERSION}`, so two jobs on different sccache versions
# read and write different namespaces and silently never share an object. Under the tarball model
# only job-coverage was version-pinned, because a tarball key does not carry the version; under
# ghac every job must be pinned to the SAME version, which is why the pin lives in the shared
# action rather than in any job. This is the same class of bug as the one-sided
# CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG that once cost fast-tier.yml its entire Rust hit rate:
# it does not fail, it just quietly stops sharing.
#
# Three rules keep the footprint inside the quota. Change any and re-check the arithmetic.
#
# 1. PR runs consume cache, never produce it. Caches saved on a `pull_request` ref are visible
#    only to that one PR, yet they bill against the shared 10 GiB and evict main's entries, which
#    every PR restores from. fast-tier.yml therefore passes `mode: read-only`, which sets
#    SCCACHE_GHA_RW_MODE=READ_ONLY. Note what changed here: this used to be the *convention* of
#    omitting a save step, and is now enforced by sccache itself. The cost is unchanged -- a
#    second push to the same PR recompiles the workspace crates it changed; deps still come from
#    main's objects, which are at most one merge stale.
#
# 2. Release jobs do not use the shared cache at all. They build with `--release`, so they share
#    zero sccache objects with the test matrix (sccache keys on the whole compiler invocation),
#    they run only on a version bump, and they are not on any latency-critical path. They keep
#    plain sccache against a local disk directory, which is never uploaded -- that is what the
#    workflow-level SCCACHE_DIR and SCCACHE_CACHE_SIZE below still exist for, and the only thing.
#    Under ghac both are inert: `storage_from_config` returns the remote backend and never
#    constructs the disk cache, so there is no local directory for a cap to bound.
#
# 3. One registry cache per (Cargo.lock, OS, arch) -- not per job family. Registry content is a
#    pure function of the lockfile, so the old -test-/-android-/-coverage-/-release- namespaces
#    stored up to 11 near-identical copies (~1.7 GiB). Lockfile-keyed also means an exact hit
#    skips the save, so unchanged deps never re-upload, and no janitor is needed to bound them.
#
# WHY GHAC, AND WHAT IT REPLACED (#562, #563, #564)
#
# The previous model tarred SCCACHE_DIR into one Actions entry per job family per run, keyed
# `<lockfile-hash>-<run_id>-<run_attempt>` so that every run saved fresh. That required a nightly
# janitor to delete all but the newest entry per family, and it required a per-family
# SCCACHE_CACHE_SIZE budget summing to less than the quota. Both are gone.
#
# Two traps from that era are worth keeping, because they are about how this fails, not about
# tarballs:
#
#   - **`SCCACHE_MAX_SIZE` is not a real sccache variable.** sccache reads only
#     SCCACHE_CACHE_SIZE (src/config.rs; nothing named SCCACHE_MAX_SIZE appears in that file at
#     all), and an unrecognised name silently leaves the default of 10 GiB. This repo set
#     SCCACHE_MAX_SIZE for its whole history, so no cap was ever enforced -- that, not the cache
#     model, was the root cause of the original quota saturation.
#   - **A cache nothing reads is not a fallback.** When job-coverage migrated first, the plan was
#     that the janitor's keep-1 would preserve its last tarball as a revert path. By the second
#     run there were zero such entries. The janitor did not delete it -- keep-1 never deletes a
#     family's only entry -- GitHub's LRU did, because the moment nothing restored it, it became
#     the repo's least-recently-used entry. Never plan around a cache no job touches.
#
# MEASURED. job-coverage ran ghac alone from #567 while every other family stayed on tarballs,
# which made the two models directly comparable on the same runs:
#
#   - Steady state, 7 consecutive main runs (31951809810 .. 32579396896): 96.79% Rust hit rate,
#     and 0 write errors, 0 read errors, 0 cache errors, 0 timeouts in every one of them. The
#     tarball model's own pre-incident best was 95.74%.
#   - Quota: coverage's entire live ghac set is 1919 objects totalling 0.97 GiB, against the
#     1.03-1.07 GiB tarball each remaining family was carrying. Migrating the rest is roughly
#     quota-neutral and removes 5.29 GiB of tarballs.
#   - Wall clock: 9.4-14.4 min across those runs. The tarball-cached ubuntu-latest test leg
#     jittered 10.0-12.4 min over the SAME runs, so the spread is runner variance, not the
#     backend -- and it is not a signal a stale single-number baseline can be read against.
#
# The one real cost is that ghac issues roughly one HTTP request per compilation unit against a
# rate-limited service, where the tarball restore it replaces moved ~2.2 GiB in about 9s. That
# shows up as HTTP 429s on write, and it got materially worse the moment this rollout landed: the
# rate limit is shared by every job in a run, so six families writing concurrently contend in a
# way the one-family spike never did. The first all-ghac main run (32599878209) lost 87% of
# job-coverage's writes and 53% of the ubuntu leg's, while both compiled, tested and READ the
# cache normally (77.73% Rust hit rate on the leg that lost half its writes).
#
# So a lost write is a normal operating condition here, not a fault: it costs one future miss,
# never correctness, and it self-heals as the namespaces warm and contention falls. `sccache-verify`
# reports the rate and fails only on TOTAL loss, which cannot be contention. What to watch is the
# trend -- if the loss rate does not fall over the next several main runs, the caches are not
# converging and the fix is to reduce concurrent write pressure (stagger the families, or make the
# non-critical ones read-only), not to loosen the check further. The full reasoning, including the
# missing RetryLayer in sccache's GHACache::build that makes 429s fatal to a write instead of
# retried, is in that action's script -- it is a property of the backend, so it lives with the
# check rather than here.
#
# Every ghac failure mode is silent, which is why `sccache-verify` asserts rather than prints.
# Read against sccache v0.17.0 + opendal 0.55.0:
#   - Rate limited: documented as "the build will continue, but the storage might not be
#     performed".
#   - Write probe fails: `RemoteStorage::check` tolerates the error and returns
#     `CacheMode::ReadOnly`, after which every put returns "Cannot write to read-only storage".
#     That does land in `cache_write_errors`, which is what makes it detectable at all. The
#     corollary bit us: a tier that ASKED for read-only reports write_errors == misses, 100%, on a
#     perfectly healthy run, because a refused put is counted the same way whether or not it was
#     requested. So `sccache-verify` judges a READ_ONLY tier on hit rate alone and never on the
#     write-error rate -- and correspondingly, that counter can no longer detect a broken backend
#     on the read-only tiers. It still can everywhere that writes.
#   - Read fails: `RemoteStorage::get` downgrades any unexpected error to `Cache::Miss` with a
#     `warn!`. A dead cache is indistinguishable from a cold one except by hit rate.
#   - Credentials missing: sccache keeps using the disk cache and the job silently keeps
#     measuring a cold local directory. Hence the `cache_location` assertion.
#
# Reverting a single job to the tarball model means: drop its `sccache-ghac` /`sccache-verify`
# steps, add back an `actions/cache/restore@v5` + `actions/cache/save@v5` pair on
# `${{ github.workspace }}/.sccache` keyed
# `sccache-<family>-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}`
# with the two shorter prefixes as restore-keys, and give it a job-level SCCACHE_CACHE_SIZE above
# its live working set. Reverting ALL of them additionally needs cache-janitor.yml back (deleted
# in this change; recover it from git history), because per-run keys thrash the quota without it.
#
# Manual cache inspection / reset:
#   gh cache list --limit 100
#   gh api repos/:owner/:repo/actions/cache/usage
#   gh cache delete --all
#
#
# Avoid pull requests- they cause needless double builds. Instead rebase from 'main'
# to your branch to give priority to your changes. Then rebase from your branch back
# to 'main', test, then push.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Ref-aware cancellation: cancel superseded runs on merge-queue / dispatch refs (iterative
  # work), but NEVER cancel a run on main/production — each main push is a distinct
  # squash-merge that may publish a release, so it must always finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' }}

# TIERED CI (see .github/workflows/fast-tier.yml):
#   - Pull requests run the FAST tier only (Linux fmt + clippy + nextest `smoke`), ~5 min.
#   - This full cross-platform matrix runs at the MERGE GATE via the merge queue
#     (`merge_group`) — once per landed feature, not on every iteration push — and on
#     every push to main/production. The release binaries are built + published only when
#     the push bumps Cargo.toml to an as-yet-unreleased version (see job-release-gate): an
#     ordinary land runs the test matrix + coverage but skips the 6-platform release build.
# This is why `pull_request` is intentionally NOT a trigger here: the full matrix is the
# gate to LAND, the fast tier is the gate to ITERATE.
on:
  push:
    branches: [main, production]
  merge_group:
  workflow_dispatch:

env:
  RUSTUP_MAX_RETRIES: 10
  CARGO_TERM_COLOR: always
  CARGO_PAGER: cat
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_NET_RETRY: 10
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: false
  RUSTFLAGS: -C debuginfo=0 --cfg reqwest_unstable # Do not produce debug symbols; enable HTTP/3 (QUIC) in reqwest
  RUST_BACKTRACE: 1
  IS_DEV_BUILD: "true" # Set "true" to speed up builds for CI testing
  RUSTC_WRAPPER: sccache
  # Both of these are inert in every job that enables ghac -- `storage_from_config` returns the
  # remote backend and never constructs the disk cache. They exist for the release jobs (rule 2),
  # which keep a purely local sccache directory that is never uploaded, and bounding that
  # directory is all SCCACHE_CACHE_SIZE does now. It is no longer a share of the 10 GiB quota.
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_CACHE_SIZE: 1G
  SCCACHE_DIRECT: "true"
  VSCMD_SKIP_SENDTELEMETRY: 1
jobs:
  job-cargo-nextest:
    name: Cargo Nextest (${{ matrix.os }})
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      # Free OSS allows up to 20 concurrent jobs; capping at 2 forced Windows nextest to
      # queue ~9-10 min behind ubuntu+macos before even starting. Run the whole matrix at
      # once so the critical path is the slowest single leg (Windows), not the sum of waves.
      max-parallel: 4
      matrix:
        include:
          - os: ubuntu-latest
            test_mode: full
          - os: ubuntu-24.04-arm
            test_mode: smoke   # ARM64 runners are resource-constrained; compile-only smoke
          - os: macos-latest
            test_mode: full
          - os: windows-latest
            test_mode: full
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}
          persist-credentials: true

      # Keeping antivirus out of the build tree is a speed optimization, not a
      # correctness requirement. Add-MpPreference is a live call to the Defender
      # service, which on hosted runners is sometimes disabled or unreachable
      # (WMI 0x800106ba) -- so it must never be able to fail the job.
      - name: Configure Windows Defender exclusions (best effort)
        if: runner.os == 'Windows'
        shell: powershell
        continue-on-error: true
        run: |
          $paths = @("${{ github.workspace }}", "$env:USERPROFILE\.cargo", "$env:TEMP")
          foreach ($path in $paths) {
            try {
              Add-MpPreference -ExclusionPath $path -ErrorAction Stop
              Write-Host "Defender exclusion added: $path"
            } catch {
              # Collapse newlines: a raw newline truncates a ::warning:: annotation.
              $reason = ($_.Exception.Message -replace '\s+', ' ').Trim()
              Write-Host "::warning::Defender exclusion skipped for ${path}: ${reason} -- builds may be slower, but correctness is unaffected."
            }
          }

      # Shared across every job in this workflow (rule 3 in the caching note above): registry
      # content is a pure function of (Cargo.lock, OS, arch), so job family is not part of the
      # key. `registry/src` is deliberately NOT cached -- cargo re-extracts it from
      # `registry/cache`, and it is the bulk of the payload (1.5 GiB of extracted sources
      # against 274 MiB of .crate archives). `~/.cargo/bin` is deliberately NOT cached either:
      # a restored stale binary satisfies taiki-e/install-action's presence check, silently
      # pinning an old nextest/sccache.
      - name: Cache Cargo registry and git
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          rustflags: ""
          cache: false

      # No sccache restore/save pair: ghac writes each object individually as it is compiled.
      # This also installs sccache, so there is no separate install step below. It sits after the
      # toolchain and before the first compile, which is all it needs: sccache reads its config
      # when the server starts, and the server starts lazily at the first compile request.
      - name: Set up sccache (ghac)
        uses: ./.github/actions/sccache-ghac

      - name: Configure deterministic tooling env
        run: |
          git config --global core.pager cat
          git config --global fetch.recurseSubmodules false
          {
            echo "PAGER=cat"
            echo "LC_ALL=C"
            echo "LANG=C"
          } >> "$GITHUB_ENV"

      - name: Preflight workspace crate roots
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r manifest; do
            crate_dir="$(dirname "$manifest")"
            # Workspace root manifests may not define a package.
            if ! grep -q "^\[package\]" "$manifest"; then
              continue
            fi
            if [ ! -f "$crate_dir/src/lib.rs" ] && [ ! -f "$crate_dir/src/main.rs" ]; then
              echo "Missing crate root in $crate_dir (expected src/lib.rs or src/main.rs)"
              missing=1
            fi
          done < <(find . -name Cargo.toml -not -path "./target/*")

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Preflight failed: one or more crates are missing source roots."
            echo "This often happens when required files exist locally but are untracked."
            exit 1
          fi

      - name: Install cargo-nextest
        if: matrix.test_mode == 'full'
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Add Cargo Bin to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Fail fast on formatting before any expensive compile. The PR fast tier already runs
      # this, but a direct push to main (e.g. the release version-bump commit) bypasses the
      # fast tier — this is main's fmt backstop. <1s; Linux only (rustfmt is platform-agnostic).
      - name: Cargo fmt --check
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: cargo fmt --all --check

      - name: Build ahma binary (required by integration tests)
        if: matrix.test_mode == 'full'
        run: cargo build --locked --no-default-features -p ahma_bin

      - name: Cargo Nextest (excluding Android/Kotlin tests)
        if: matrix.test_mode == 'full'
        timeout-minutes: 40
        run: |
          echo "--- cargo --version" && cargo --version
          echo "--- cargo nextest --version" && cargo nextest --version
          echo "--- Running cargo nextest run --profile ci"
          # --no-fail-fast: surface EVERY failing test in a single run instead of
          # cancelling at the first failure.  Without it, a platform with several
          # independent failures (notably Windows) only reveals one per CI round,
          # turning stabilization into a slow whack-a-mole across many pushes.
          cargo nextest run --profile ci --locked --no-default-features --no-fail-fast -E 'not (test(kotlin) or test(android))'

      - name: Cargo Nextest (AGPL product crates)
        if: matrix.test_mode == 'full'
        timeout-minutes: 20
        run: |
          echo "--- Testing AGPL product crates"
          cargo nextest run --profile ci --locked \
            -p ahma_tui -p ahma_bin \
            -E 'not (test(kotlin) or test(android))'

      - name: Cargo Nextest (Landlock red-team, Linux only)
        if: matrix.test_mode == 'full' && runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          echo "--- Running ignored Landlock red-team tests (they self-skip when Landlock is unavailable)"
          cargo nextest run --profile ci --locked --no-default-features --run-ignored only \
            -p ahma_mcp \
            -E 'test(red_team_global_read_access_blocked) or test(red_team_livelog_symlink_read_allowed)'

      - name: ARM64 smoke validation (compile-only)
        if: matrix.test_mode == 'smoke'
        timeout-minutes: 25
        run: |
          echo "--- ARM64 smoke: compile-only validation of key crates (no test execution)"
          cargo test --locked --no-default-features -p ahma_bin --no-run
          cargo test --locked --no-default-features -p ahma_http_bridge --no-run

      - name: Cargo Clippy
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: cargo clippy --locked

      - name: Cargo Clippy (no-default-features)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: cargo clippy --no-default-features --locked

      - name: Cargo Clippy Tests
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: cargo clippy --tests --locked

      - name: Cargo Doc
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: cargo doc --no-deps

      - name: Upload documentation
        if: runner.os == 'Linux' && runner.arch == 'X64'
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: target/doc

      # Replaces the old Show-stats / Stop-server / Save trio. There is nothing to stop or save --
      # ghac awaits each write inside the compile request, so the stats are already complete once
      # cargo exits, and `--stop-server` before `--show-stats` would only throw them away. Runs on
      # every platform including Windows, which the old stats step skipped.
      - name: Verify sccache (ghac)
        if: always()
        uses: ./.github/actions/sccache-verify
        with:
          label: Cargo Nextest (${{ matrix.os }})

  #######################################

  job-security:
    name: Security (cargo deny)
    runs-on: ubuntu-latest
    # Run on every push and PR to every branch for earliest CVE detection.
    # This job is intentionally independent of the test matrix.
    env:
      RUSTC_WRAPPER: "" # cargo-deny runs in Docker without sccache; unset the workflow-level wrapper
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
          persist-credentials: true

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Check all four categories: advisories, licenses, bans, sources
          command: check
          # Point at our deny.toml at the workspace root
          manifest-path: Cargo.toml

      - name: Check workspace license boundaries
        run: bash ./scripts/check-license-boundaries.sh

  #######################################

  # Single aggregate gate. This is the ONE required status check on main (rename-stable —
  # individual matrix legs can be renamed without touching branch protection). The merge
  # queue runs this on `merge_group` before merging; a push to main runs it as the release
  # precondition. `if: always()` + explicit result checks make a skipped/failed dependency
  # FAIL the gate (a plain `needs:` would let a skipped dep pass silently).
  ci-green:
    name: CI green
    if: always()
    needs:
      - job-cargo-nextest
      - job-android-nextest
      - job-security
      - job-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          echo "nextest=${{ needs.job-cargo-nextest.result }}"
          echo "android=${{ needs.job-android-nextest.result }}"
          echo "security=${{ needs.job-security.result }}"
          echo "coverage=${{ needs.job-coverage.result }}"
          fail=0
          [ "${{ needs.job-cargo-nextest.result }}" = "success" ] || { echo '::error::test matrix did not pass'; fail=1; }
          [ "${{ needs.job-android-nextest.result }}" = "success" ] || { echo '::error::android tests did not pass'; fail=1; }
          [ "${{ needs.job-security.result }}" = "success" ] || { echo '::error::security (cargo deny) did not pass'; fail=1; }
          # job-coverage only runs on main-branch pushes (its own `if:`), so it is
          # legitimately "skipped" on production pushes / workflow_dispatch. Gate on
          # an actual failure, not on a skip — on the release path (main push) it
          # always runs, so this still blocks a release when coverage fails.
          case "${{ needs.job-coverage.result }}" in
            success|skipped) ;;
            *) echo '::error::coverage did not pass'; fail=1 ;;
          esac
          exit $fail

  #######################################

  job-android-nextest:
    name: Android Nextest
    runs-on: macos-latest
    env:
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # There are deliberately NO Gradle caches in this job. Two used to exist (`gradle-deeper-*`
      # for ~/.gradle deps and `gradle-android-build-*` for the sample app's build outputs) and
      # BOTH were no-ops for this repo's entire history: every run ended with
      #   Path Validation Error: Path(s) specified in the action for caching do(es) not exist,
      #   hence no cache is being saved.
      # and correspondingly no `gradle-*` entry has ever appeared in `gh cache list`. The paths
      # never materialise because the tests this job runs (`-p ahma_mcp --features android -E
      # 'test(kotlin) or test(android)'`) do not drive a Gradle build of test-data/, so neither
      # ~/.gradle nor app/build/* is ever populated. Restoring could not hit either, since
      # nothing was ever stored. They were pure warning noise plus the false impression that
      # Gradle work was cached.
      #
      # If a real Gradle build is added to this job, re-add caching then -- and verify the save
      # actually stores by checking for a `gradle-*` key in `gh cache list`, not just a green
      # step: the save step succeeds even when it stores nothing.
      #
      # See the registry cache in job-cargo-nextest for why this key has no job-family segment
      # and why registry/src and ~/.cargo/bin are excluded.
      - name: Cache Cargo registry and git
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache: false

      - name: Set up sccache (ghac)
        uses: ./.github/actions/sccache-ghac
        with:
          extra-tools: nextest,cargo-ndk

      - name: Add Cargo Bin to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Run Android/Kotlin nextest only
        run: |
          # Run ONLY kotlin/android tests (feature-gated and name-filtered for clarity)
          cargo nextest run --profile ci --locked -p ahma_mcp --features android -E 'test(kotlin) or test(android)'

      - name: Verify sccache (ghac)
        if: always()
        uses: ./.github/actions/sccache-verify
        with:
          label: Android Nextest

  #######################################

  job-coverage:
    runs-on: ubuntu-latest
    # Only run on main branch pushes, not pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
      # Only so the sccache verify step can report repo-wide cache usage in the step summary.
      # This is the one job that does it: it is main-only and unique, so the number is reported
      # once per main run rather than once per matrix leg.
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}
          persist-credentials: true

      # See the registry cache in job-cargo-nextest for why this key has no job-family segment
      # and why registry/src and ~/.cargo/bin are excluded.
      - name: Cache Cargo registry and git
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
          rustflags: ""
          cache: false

      # No sccache restore/save pair: ghac writes each object individually as it is compiled.
      # This also installs sccache, nextest and cargo-llvm-cov.
      - name: Set up sccache (ghac)
        uses: ./.github/actions/sccache-ghac
        with:
          extra-tools: nextest,cargo-llvm-cov

      - name: Configure deterministic tooling env
        run: |
          git config --global core.pager cat
          git config --global fetch.recurseSubmodules false
          {
            echo "PAGER=cat"
            echo "LC_ALL=C"
            echo "LANG=C"
          } >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: |
          [ -x "$HOME/.cargo/bin/cargo-ndk" ] || cargo install cargo-ndk

      - name: Build ahma binary (required by integration tests)
        run: cargo build --locked --no-default-features -p ahma_bin

      - name: Generate coverage report
        timeout-minutes: 40
        run: |
          # Run the instrumented test suite ONCE, deferring report generation so we can
          # emit several report formats from the same profdata without re-running tests.
          cargo llvm-cov nextest --no-report --profile coverage --locked --no-default-features -E 'not (test(kotlin) or test(android))'

          # 1. Full line-by-line HTML for humans drilling into a specific file.
          cargo llvm-cov report --html --output-dir ./coverage

          # 2. Compact machine-readable per-file summary (no per-line trivia) for coverage
          #    planning by tools/agents — see /ahmadev coverage.
          cargo llvm-cov report --json --summary-only --output-path ./coverage/coverage-summary.json

          # 3. Tiny markdown table of the WORST-covered workspace files, sorted ascending by
          #    line coverage. This is the single artifact an LLM should read to plan tests:
          #    it is a few KB and contains no source lines. Paths are made workspace-relative.
          #    Non-fatal: a jq hiccup must never block the HTML/Pages deploy (coverage-summary.json
          #    still carries the same data for /ahmadev coverage to fall back on).
          jq -r --arg ws "$PWD/" '
            "Coverage summary (sorted by line coverage, ascending). Generated from coverage-summary.json.",
            "",
            "Totals: lines \(.data[0].totals.lines.percent | .*100 | round / 100)% (\(.data[0].totals.lines.covered)/\(.data[0].totals.lines.count)), " +
              "functions \(.data[0].totals.functions.percent | .*100 | round / 100)%, " +
              "regions \(.data[0].totals.regions.percent | .*100 | round / 100)%.",
            "",
            "| file | line% | lines (cov/total) | fn% | region% |",
            "|------|------:|-------------------|----:|--------:|",
            ( .data[0].files
              | map({ f: (.filename | sub("^"+$ws; "")),
                      lp: .summary.lines.percent, lcov: .summary.lines.covered, lc: .summary.lines.count,
                      fp: .summary.functions.percent, rp: .summary.regions.percent })
              | sort_by(.lp)[]
              | "| \(.f) | \(.lp*100|round/100) | \(.lcov)/\(.lc) | \(.fp*100|round/100) | \(.rp*100|round/100) |" )
          ' ./coverage/coverage-summary.json > ./coverage/coverage-lowest.md \
            || echo "coverage-lowest.md generation failed (non-fatal); use coverage-summary.json" > ./coverage/coverage-lowest.md

      - name: Generate code simplicity report
        run: |
          cargo run -p ahma_bin --features simplify -- simplify . --limit 20 --html
          cp CODE_SIMPLICITY.md coverage/
          cp CODE_SIMPLICITY.html coverage/

      - name: Generate Rust Docs
        run: |
          cargo doc --no-deps
          cp -r target/doc coverage/
          echo '<meta http-equiv="refresh" content="0; url=ahma_mcp/index.html">' > coverage/doc/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload coverage artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./coverage

      - name: Upload code simplicity report artifact
        uses: actions/upload-artifact@v7
        with:
          name: code-simplicity-report
          path: ./coverage/CODE_SIMPLICITY.md

      - name: Upload compact coverage summary artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: |
            ./coverage/coverage-summary.json
            ./coverage/coverage-lowest.md

      - name: Deploy to GitHub Pages
        id: deployment
        # Non-fatal: publishing the coverage/docs report to Pages is a side-artifact, not a
        # release-correctness signal. GitHub's Pages deployment API intermittently returns
        # "Deployment failed, try again later" (a platform-side hiccup, seen even on isolated
        # single pushes with no concurrent deploys). Because ci-green -> job-publish-release
        # depends on this job, a flaky Pages publish was blocking otherwise-green releases.
        # The instrumented test run above still gates the job (a real regression fails it and
        # blocks the release); only the external publish is allowed to flake. The report
        # simply republishes on the next successful main push.
        continue-on-error: true
        uses: actions/deploy-pages@v5

      # This DOES fail the job, a deliberate break with the "a cache save must never redden a
      # green job" convention the tarball steps used. That convention is right when the cache is
      # pure optimisation; every way ghac can fail leaves the job green instead, so an unasserted
      # cache measures nothing. Placed after the Pages deploy so a cache verdict never costs the
      # coverage report.
      - name: Verify sccache (ghac)
        if: always()
        uses: ./.github/actions/sccache-verify
        with:
          label: Coverage
          report-quota: "true"
          github-token: ${{ github.token }}

  #######################################

  # Release gate: the version number is the release trigger. This cheap job (~10s) decides
  # ONCE whether the version in Cargo.toml has already been released, and gates the expensive
  # 6-platform release build + publish below. A push to main that does NOT bump the version
  # (an ordinary land) therefore skips the release builds entirely — it only runs the test
  # matrix + coverage. Release binaries are built (and Sigstore-attested) exactly once per
  # version, at the bump that ships it, so there are never two different binaries claiming the
  # same version.
  job-release-gate:
    name: Release Gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
          persist-credentials: true

      - name: Decide whether this version is unreleased
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed -E 's/^version = "(.*)"/\1/')
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if gh release view "${TAG}" --json tagName > /dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} already exists — skipping release builds for this push."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} not found — this push will build and publish it."
          fi

  #######################################

  job-release-binaries:
    name: Release Binaries (${{ matrix.platform }})
    # Run only on main pushes that bump to an as-yet-unreleased version (see job-release-gate).
    needs: job-release-gate
    if: needs.job-release-gate.outputs.should_release == 'true'
    permissions:
      id-token: write      # for Sigstore OIDC token (GitHub attestation)
      attestations: write  # to write SLSA provenance to GitHub's attestation API
      contents: read       # for checkout
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      # 6 release targets; run them all concurrently. At max-parallel:2 the musl-arm64 tail
      # didn't start until +22 min and set the ~31-min post-merge time on its own.
      max-parallel: 6
      matrix:
        include:
          # Native builds (no cross-compilation needed)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-arm64
            use_cross: false
          # Windows native build
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            use_cross: false
          # Cross-compiled aarch64 glibc build.
          # We deliberately do NOT build natively on `ubuntu-24.04-arm` because
          # GitHub's hosted ARM64 runners terminate during the heavy release
          # compilation of this workspace (e.g. `ahma_mcp`), see commit 9a315fc
          # and the failure of run 26750268775 for prior evidence.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            use_cross: true
          # Cross-compiled musl builds (portable, no glibc dependency)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x86_64-musl
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            platform: linux-arm64-musl
            use_cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}
          persist-credentials: true

      # Keeping antivirus out of the build tree is a speed optimization, not a
      # correctness requirement. Add-MpPreference is a live call to the Defender
      # service, which on hosted runners is sometimes disabled or unreachable
      # (WMI 0x800106ba) -- so it must never be able to fail the job.
      - name: Configure Windows Defender exclusions (best effort)
        if: runner.os == 'Windows'
        shell: powershell
        continue-on-error: true
        run: |
          $paths = @("${{ github.workspace }}", "$env:USERPROFILE\.cargo", "$env:TEMP")
          foreach ($path in $paths) {
            try {
              Add-MpPreference -ExclusionPath $path -ErrorAction Stop
              Write-Host "Defender exclusion added: $path"
            } catch {
              # Collapse newlines: a raw newline truncates a ::warning:: annotation.
              $reason = ($_.Exception.Message -replace '\s+', ' ').Trim()
              Write-Host "::warning::Defender exclusion skipped for ${path}: ${reason} -- builds may be slower, but correctness is unaffected."
            }
          }

      # Registry only, and NOT keyed on matrix.target: the registry is host-side, identical for
      # every target built on a given runner, so the 4 ubuntu legs share one entry (previously
      # 6 near-identical copies, ~0.8 GiB). See job-cargo-nextest for the path exclusions.
      #
      # Expect "Unable to reserve cache with key ..., another job may be creating this cache"
      # warnings here on a release run: this job needs only job-release-gate (~10s), so the 4
      # ubuntu legs start alongside the ubuntu test legs and race to save the now-shared key.
      # It is benign -- the loser skips the upload and the step still succeeds, and whichever
      # wins writes identical content, since the key already pins (Cargo.lock, OS, arch). That
      # content-independence is the whole reason one shared registry entry is safe.
      #
      # There is deliberately NO sccache cache here -- rule 2 in the caching note at the top of
      # this file. Release legs build with `--release`, so they share zero sccache objects with
      # the test matrix, they run only on a version bump, and they are off the critical path;
      # their 3 entries cost ~1.2 GiB of a 10 GiB quota that every merge competes for.
      # RUSTC_WRAPPER stays set so the stats step below still reports, but nothing is uploaded.
      - name: Cache Cargo registry and git
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          rustflags: ""
          cache: false

      - name: Configure deterministic tooling env
        run: |
          git config --global core.pager cat
          git config --global fetch.recurseSubmodules false
          {
            echo "PAGER=cat"
            echo "LC_ALL=C"
            echo "LANG=C"
          } >> "$GITHUB_ENV"

      - name: Preflight workspace crate roots
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r manifest; do
            crate_dir="$(dirname "$manifest")"
            # Workspace root manifests may not define a package.
            if ! grep -q "^\[package\]" "$manifest"; then
              continue
            fi
            if [ ! -f "$crate_dir/src/lib.rs" ] && [ ! -f "$crate_dir/src/main.rs" ]; then
              echo "Missing crate root in $crate_dir (expected src/lib.rs or src/main.rs)"
              missing=1
            fi
          done < <(find . -name Cargo.toml -not -path "./target/*")

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Preflight failed: one or more crates are missing source roots."
            echo "This often happens when required files exist locally but are untracked."
            exit 1
          fi

      - name: Install sccache
        if: "!matrix.use_cross"
        uses: taiki-e/install-action@v2
        with:
          tool: sccache

      - name: Add Cargo Bin to PATH (macOS)
        if: "!matrix.use_cross && runner.os == 'macOS'"
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cross (for cross-compilation)
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build release binaries (native)
        if: "!matrix.use_cross"
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p ahma_bin

      - name: Build release binaries (cross-compiled)
        if: matrix.use_cross
        run: |
          # Disable sccache for cross builds (incompatible with cross's Docker containers)
          unset RUSTC_WRAPPER
          cross build --release --locked --target ${{ matrix.target }} -p ahma_bin

      - name: Package release binaries
        id: package
        run: |
          set -euo pipefail
          platform="${{ matrix.platform }}"
          mkdir -p dist
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            archive_name="ahma-release-${platform}.zip"
            cp "target/${{ matrix.target }}/release/ahma.exe" dist/
            cp README.md dist/
            (cd dist && sha256sum ahma.exe > SHA256SUMS)
            (cd dist && 7z a "../${archive_name}" ahma.exe SHA256SUMS README.md)
          else
            archive_name="ahma-release-${platform}.tar.gz"
            cp target/${{ matrix.target }}/release/ahma dist/
            cp README.md dist/
            (cd dist && shasum -a 256 ahma > SHA256SUMS)
            tar -czf "$archive_name" -C dist ahma SHA256SUMS README.md
          fi
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"

      - name: Upload release binaries artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries-${{ matrix.platform }}
          path: ${{ steps.package.outputs.archive_name }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ steps.package.outputs.archive_name }}
            dist/ahma*

      - name: Show sccache stats
        if: always() && !matrix.use_cross && runner.os != 'Windows'
        run: |
          sccache --show-stats || true
          sccache --stop-server || true

  #######################################

  job-publish-release:
    name: Publish Release
    # Gate the release on correctness (ci-green already aggregates nextest + android +
    # security) plus the actual artifacts (release-binaries). Coverage is a Pages/reporting
    # job (~8 min) and is intentionally NOT on the release critical path anymore — it runs
    # in parallel without blocking the publish.
    needs:
      - ci-green
      - job-release-gate
      - job-release-binaries
    if: needs.job-release-gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
          persist-credentials: true

      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-binaries-*
          merge-multiple: true

      - name: Generate combined SHA256SUMS
        run: |
          # 1. Produce a single SHA256SUMS file covering every release archive.
          sha256sum ahma-release-*.tar.gz ahma-release-*.zip > SHA256SUMS

          # 2. Extract the individual binary hashes from the archives and append them
          # to the combined SHA256SUMS file. This allows verifying the installed binary
          # directly without downloading the archive again.
          echo "" >> SHA256SUMS
          echo "# Raw Binaries" >> SHA256SUMS
          for f in ahma-release-*.tar.gz; do
            if [ -f "$f" ]; then
              platform=$(echo "$f" | sed -E 's/ahma-release-(.*)\.tar\.gz/\1/')
              hash=$(tar -xOf "$f" SHA256SUMS | grep -E "ahma$" | head -n 1 | awk '{print $1}')
              echo "$hash  ahma-${platform}" >> SHA256SUMS
            fi
          done
          for f in ahma-release-*.zip; do
            if [ -f "$f" ]; then
              platform=$(echo "$f" | sed -E 's/ahma-release-(.*)\.zip/\1/')
              hash=$(unzip -p "$f" SHA256SUMS | grep "ahma.exe" | head -n 1 | awk '{print $1}')
              echo "$hash  ahma-${platform}.exe" >> SHA256SUMS
            fi
          done

          echo "Combined SHA256SUMS contents:"
          cat SHA256SUMS

      - name: Determine release tag
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed -E 's/^version = "(.*)"/\1/')
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # Skip if this exact version was already published
          if gh release view "${TAG}" --json tagName > /dev/null 2>&1; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} already exists — skipping."
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        if: steps.version.outputs.already_released == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            ## Ahma ${{ steps.version.outputs.tag }}

            Built from [`main`](https://github.com/paulirotta/ahma/tree/main) via the [CI pipeline](https://github.com/paulirotta/ahma/actions/workflows/build.yml).

            ### Install

            **Linux / macOS:**
            ```bash
            curl -sSf https://raw.githubusercontent.com/paulirotta/ahma/main/scripts/install.sh | bash
            export PATH="$HOME/.local/bin:$PATH"
            ```

            **Windows (PowerShell 5.1+):**
            ```powershell
            irm https://raw.githubusercontent.com/paulirotta/ahma/main/scripts/install.ps1 | iex
            ```

            **Update an existing install:**
            ```bash
            ahma update
            ```

            ### Supply chain protection — SLSA Level 3 via Sigstore

            Every release archive and raw binary has a **GitHub Build Provenance Attestation** (Sigstore).
            Attestations are keyless — signed by an ephemeral Fulcio certificate bound to this workflow's
            OIDC identity. No private key exists; no rotation is needed.

            **`ahma update` and `ahma verify --self` verify the attestation automatically.**

            **Manual out-of-band verification:**
            ```bash
            gh attestation verify ahma-release-linux-x86_64.tar.gz \
              --repo paulirotta/ahma
            ```

            ### AGPL + SLSA: two-layer supply chain defence

            The `ahma` binary and security-relevant crates are **AGPL-3.0-or-later**.
            AGPL requires source disclosure for any distributed or network-accessible modification,
            closing the route of shipping a backdoored binary without publishing the changes.
            The Sigstore attestation verifies that what you install was built from the published,
            auditable source by the official CI pipeline.

            Building from auditable source is always an option:
            ```bash
            cargo install --git https://github.com/paulirotta/ahma ahma_bin --bin ahma --root ~/.local --locked
            ```

            See [docs/release-signing.md](https://github.com/paulirotta/ahma/blob/main/docs/release-signing.md)
            for the trust model and verification details.
          draft: false
          prerelease: false
          make_latest: "true"
          files: |
            ahma-release-*.tar.gz
            ahma-release-*.zip
            SHA256SUMS

