name: Fast Tier

# FAST FEEDBACK for the AI/dev iteration loop. Runs on every pull-request push and gives a
# verdict in ~5 min: cargo fmt --check, cargo deny, clippy, and the nextest `smoke` profile
# (Linux only, in-process tests only — no subprocess integration suite).
#
# This IS the merge gate. The merge-queue design was abandoned (the `merge_queue` ruleset is
# unavailable on this repo), so `Fast Tier` is the single *required* status check on main and
# `gh pr merge --auto` lands a PR the moment it passes. The full cross-platform matrix
# (.github/workflows/build.yml) runs on `push` to main — i.e. AFTER the merge — as a safety
# net; it cannot gate a PR because it does not run on `pull_request`.
#
# The corollary drives what belongs here: anything that can redden main and is NOT covered by
# fmt/clippy/smoke must be added to this job, or it is caught only post-merge. `cargo deny` is
# here for exactly that reason (see the step below). Keep the tier cheap — but "cheap" cannot
# mean "unable to catch a whole class of breakage before it lands".
#
# Trigger model: PR only. Superseded pushes are cancelled to save runner minutes.

permissions:
  contents: read

concurrency:
  group: fast-tier-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, production]
  workflow_dispatch:

env:
  RUSTUP_MAX_RETRIES: 10
  CARGO_TERM_COLOR: always
  CARGO_PAGER: cat
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_NET_RETRY: 10
  RUSTFLAGS: -C debuginfo=0 --cfg reqwest_unstable
  RUST_BACKTRACE: 1
  IS_DEV_BUILD: "true"
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  # Must match build.yml's cap: this tier restores build.yml's `-test-` entries, and a smaller
  # cap here would make sccache evict most of what it just downloaded on the first write.
  SCCACHE_MAX_SIZE: 1G
  SCCACHE_DIRECT: "true"

jobs:
  fast-tier:
    name: Fast Tier (fmt + clippy + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}
          persist-credentials: true

      # RESTORE-ONLY, both of them. This tier runs on `pull_request`, and a cache saved on a PR
      # ref is visible only to that one PR -- yet it bills against the repo-wide 10 GiB quota and
      # LRU-evicts main's entries, which every PR restores from. So one PR's private cache is
      # bought with every other PR's hit rate. See the caching strategy note at the top of
      # build.yml (rule 1).
      #
      # The keys are build.yml's `-test-` Linux/X64 keys, so a cold PR warms from the last merge
      # (at most one merge stale). `fail-on-cache-miss` is deliberately NOT set: a total miss
      # must slow the tier down, never fail it.
      #
      # The cost is real and accepted: a second push to the same PR recompiles the workspace
      # crates it changed. Dependencies still come from main's cache.
      #
      # MEASURED, and not what you would assume: restoring this cache yields
      # `Cache hits rate (Rust) 0.00 %` -- 924 Rust misses, 0 hits. All 413 hits are C/C++ and
      # assembler, i.e. the native build scripts (ring, aws-lc-sys, zstd-sys), which are 100%.
      # The Rust objects never match because the entry is produced by build.yml's test job,
      # which compiles a different flag set than this tier's `cargo clippy --all-targets` and
      # `cargo nextest --no-default-features`; sccache keys on the whole rustc invocation.
      # So the restore is still worth its ~9s download -- the native deps are the slow part --
      # but do not expect it to cache Rust. Closing that gap means either giving this tier a
      # namespace it also writes (which rule 1 forbids) or aligning the flags with build.yml
      # (which changes what the tier tests). Neither is a caching change; left as follow-up.
      - name: Restore Cargo registry and git
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore sccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sccache-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-
            sccache-test-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          rustflags: ""
          cache: false

      - name: Configure deterministic tooling env
        run: |
          git config --global core.pager cat
          {
            echo "PAGER=cat"
            echo "LC_ALL=C"
            echo "LANG=C"
          } >> "$GITHUB_ENV"

      - name: Install sccache, nextest and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: sccache,nextest,cargo-deny

      - name: Add Cargo Bin to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Cheapest check first: fail in <1s on a formatting violation before any compile.
      - name: Cargo fmt --check
        run: cargo fmt --all --check

      # Dependency policy. This reads Cargo.lock — no compile — so it is seconds, and it
      # belongs HERE rather than only in build.yml: build.yml runs on `push` to main, never
      # on `pull_request`, so before this step a licence/advisory/ban violation could not be
      # caught by any PR gate and was *guaranteed* to land and redden main. (It did: zip 8.6's
      # default features pulled in bzip2, whose licence is not on the allow-list — #470.)
      # The full check, not just `advisories`: licences are exactly what got through.
      - name: Cargo deny check
        run: cargo deny check

      - name: Cargo Clippy
        run: cargo clippy --all-targets --locked

      # The `smoke` nextest profile (.config/nextest.toml) excludes the subprocess-spawning
      # integration suite and Android/Kotlin tests, so this runs fast and fully parallel.
      - name: Cargo Nextest (smoke)
        run: cargo nextest run --profile smoke --locked --no-default-features

      - name: Show sccache stats
        if: always()
        run: |
          sccache --show-stats || true
          sccache --stop-server || true
