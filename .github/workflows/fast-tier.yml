name: Fast Tier

# FAST FEEDBACK for the AI/dev iteration loop. Runs on every pull-request push and gives a
# verdict in ~5 min: cargo fmt --check, cargo deny, clippy, and the nextest `smoke` profile
# (Linux only, in-process tests only — no subprocess integration suite).
#
# This IS the merge gate. The merge-queue design was abandoned (the `merge_queue` ruleset is
# unavailable on this repo), so `Fast Tier` is the single *required* status check on main and
# `gh pr merge --auto` lands a PR the moment it passes. The full cross-platform matrix
# (.github/workflows/build.yml) runs on `push` to main — i.e. AFTER the merge — as a safety
# net; it cannot gate a PR because it does not run on `pull_request`.
#
# The corollary drives what belongs here: anything that can redden main and is NOT covered by
# fmt/clippy/smoke must be added to this job, or it is caught only post-merge. `cargo deny` is
# here for exactly that reason (see the step below). Keep the tier cheap — but "cheap" cannot
# mean "unable to catch a whole class of breakage before it lands".
#
# Trigger model: PR only. Superseded pushes are cancelled to save runner minutes.

permissions:
  contents: read

concurrency:
  group: fast-tier-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, production]
  workflow_dispatch:

env:
  RUSTUP_MAX_RETRIES: 10
  CARGO_TERM_COLOR: always
  CARGO_PAGER: cat
  CARGO_INCREMENTAL: 0
  # Both profile lines must stay equal to each other and to build.yml (see the note there).
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_NET_RETRY: 10
  # MUST match build.yml's env exactly, or this tier gets 0% Rust cache hits. This one variable
  # being absent here was the entire cause: it sets [profile.dev.build-override] debug, which
  # changes the rustc invocation for build scripts and proc macros. sccache's Rust hashing
  # includes the contents of `--extern` inputs, so a differently-compiled proc-macro artifact
  # changes the hash of every crate that depends on it -- cascading to a total Rust miss against
  # a cache that build.yml populated. C/C++ objects stayed at 100% precisely because they do not
  # depend on Rust proc macros. Before adding any other CARGO_*/RUSTFLAGS here, add it to
  # build.yml too; a one-sided profile variable silently destroys this tier's cache reuse.
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: false
  RUSTFLAGS: -C debuginfo=0 --cfg reqwest_unstable
  RUST_BACKTRACE: 1
  IS_DEV_BUILD: "true"
  RUSTC_WRAPPER: sccache
  SCCACHE_DIRECT: "true"

jobs:
  fast-tier:
    name: Fast Tier (fmt + clippy + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}
          persist-credentials: true

      # RESTORE-ONLY, both of them. This tier runs on `pull_request`, and a cache saved on a PR
      # ref is visible only to that one PR -- yet it bills against the repo-wide 10 GiB quota and
      # LRU-evicts main's entries, which every PR restores from. So one PR's private cache is
      # bought with every other PR's hit rate. See the caching strategy note at the top of
      # build.yml (rule 1).
      #
      # The keys are build.yml's `-test-` Linux/X64 keys, so a cold PR warms from the last merge
      # (at most one merge stale). `fail-on-cache-miss` is deliberately NOT set: a total miss
      # must slow the tier down, never fail it.
      #
      # The cost is real and accepted: a second push to the same PR recompiles the workspace
      # crates it changed. Dependencies still come from main's cache.
      #
      # This restore yielded `Cache hits rate (Rust) 0.00 %` -- 924 Rust misses, 0 hits, with all
      # 413 hits being C/C++ and assembler at 100% -- until the missing
      # CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG was added to this workflow's env above. See the
      # comment there for the mechanism. Feature flags matter for the same reason: this tier
      # and build.yml now both build the single canonical flavour (default features), so the
      # objects are byte-identical inputs and the hashes line up. If Rust hit rate here ever
      # returns to ~0, suspect a new one-sided env var or a one-sided feature flag first.
      - name: Restore Cargo registry and git
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-${{ runner.arch }}-

      # `read-only` is rule 1 of build.yml's caching note, enforced by sccache rather than by the
      # convention of omitting a save step: this tier reads the objects build.yml's main runs
      # wrote and writes nothing back, so PR runs cannot evict main's entries. It reads the same
      # namespace build.yml populates, which is why the env block above must keep matching
      # build.yml's exactly -- see the note on CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          rustflags: ""
          cache: false

      - name: Set up sccache (ghac, read-only)
        uses: ./.github/actions/sccache-ghac
        with:
          mode: read-only
          extra-tools: nextest,cargo-deny,cargo-hakari

      - name: Configure deterministic tooling env
        run: |
          git config --global core.pager cat
          {
            echo "PAGER=cat"
            echo "LC_ALL=C"
            echo "LANG=C"
          } >> "$GITHUB_ENV"

      - name: Add Cargo Bin to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Cheapest check first: fail in <1s on a formatting violation before any compile.
      - name: Cargo fmt --check
        run: cargo fmt --all --check

      # Dependency policy. This reads Cargo.lock — no compile — so it is seconds, and it
      # belongs HERE rather than only in build.yml: build.yml runs on `push` to main, never
      # on `pull_request`, so before this step a licence/advisory/ban violation could not be
      # caught by any PR gate and was *guaranteed* to land and redden main. (It did: zip 8.6's
      # default features pulled in bzip2, whose licence is not on the allow-list — #470.)
      # The full check, not just `advisories`: licences are exactly what got through.
      - name: Cargo deny check
        run: cargo deny check

      # Also lock-file-only, also seconds: workspace-hack/ must match the dependency graph
      # (otherwise `-p <crate>` builds stop sharing the workspace build's artifacts — the
      # target-dir bloat this workspace was reorganised to stop) and the graph must carry
      # exactly one rustls crypto provider. Neither is checked by any compile step, and the
      # pre-push guardrail that runs this locally is opt-in.
      - name: Dependency graph invariants
        run: bash ./scripts/check-dependency-graph.sh

      - name: Cargo Clippy
        run: cargo clippy --all-targets --locked

      # The `smoke` nextest profile (.config/nextest.toml) excludes the subprocess-spawning
      # integration suite and Android/Kotlin tests, so this runs fast and fully parallel.
      - name: Cargo Nextest (smoke)
        # Default features: the one canonical flavour (see build.yml). Read-only sccache
        # mode means this tier can only hit objects build.yml produced -- same flavour or
        # zero hits.
        run: cargo nextest run --profile smoke --locked

      # xtask has no coverage from any other invocation here -- it is outside
      # `default-members`, so fmt/clippy/smoke all resolve past it. A break in
      # `cargo xtask bump-version` would otherwise reach main unnoticed, which
      # is exactly what this tier's header says must not happen. build.yml runs
      # the same step on main and writes the objects, so this read-only tier
      # hits them instead of compiling xtask cold on every PR. See the note
      # there for why `-p` rather than `--workspace`.
      - name: Cargo Clippy + Nextest (xtask)
        run: |
          cargo clippy -p xtask --all-targets --locked
          cargo nextest run -p xtask --locked

      # nextest cannot run doctests, so every other test step in every tier can be
      # green while a documented example no longer compiles -- which is exactly how
      # ahma_mcp's headline "Initializing the Engine" example came to pass a stale
      # argument to Adapter::new. This is the only step that compiles them.
      # Seconds, because it builds examples rather than the workspace.
      - name: Cargo Test (doc examples)
        run: cargo test --doc --locked

      # Doc warnings are a merge gate, not a post-merge discovery. `-D warnings`
      # with `--document-private-items`: rustdoc skips private items by default,
      # and that is where intra-doc links rot unseen (see build.yml's note).
      - name: Cargo Doc (warnings denied)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items --locked

      # Verifies the backend and the hit rate, but cannot fail on "misses without writes": this
      # tier is READ_ONLY, so writing nothing is the intended behaviour, and the action skips
      # that particular assertion when it sees SCCACHE_GHA_RW_MODE=READ_ONLY.
      - name: Verify sccache (ghac)
        if: always()
        uses: ./.github/actions/sccache-verify
        with:
          label: Fast Tier
