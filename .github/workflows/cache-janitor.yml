name: Cache Janitor

# REQUIRED COMPANION to the run-scoped cache keys in build.yml. Read the caching strategy note
# at the top of that file first.
#
# build.yml keys its sccache entries on `<lockfile-hash>-<run_id>-<run_attempt>` so that every
# run saves fresh instead of being frozen by an exact key hit. The cost of that fix is that
# every run mints a NEW key, so nothing is ever overwritten and the repo-wide 10 GiB quota fills
# with superseded entries. GitHub's own LRU does eventually evict, but it evicts by
# last-accessed across the whole repo, which means a large stale entry can outlive the small
# fresh one a job actually needs. This job does the bounded, deliberate version: keep the newest
# N per cache family, delete the rest.
#
# The keep counts are the budget. Steady state must stay under ~7 GiB to leave headroom for a
# run that saves before the janitor has swept the previous one. Sizes below are MEASURED from
# run 31397218194 where noted, not estimated; the caps only started binding once the variable
# was renamed from the never-recognised SCCACHE_MAX_SIZE to SCCACHE_CACHE_SIZE:
#
#   sccache-test-*        4 legs x 1 GiB cap  x keep 1 = 4.4 GiB  (tarball ~1.1x the dir)
#   sccache-coverage-*    1 leg  x 800 MiB    x keep 1 = 0.9 GiB
#   sccache-android-*     1 leg  x 600 MiB    x keep 1 = 0.7 GiB
#   sccache-codeql-*      1 leg  x 600 MiB    x keep 1 = 0.2 GiB  (measured 125 MiB; cap is slack)
#   cargo-registry-*      4 os/arch x ~65 MiB x keep 2 = 0.5 GiB  (measured 58-73 MiB each)
#                                                        -------
#                                                        ~6.7 GiB
#
# Nothing else may save a cache without being added to that table. Three sources are
# deliberately absent because they never save: fast-tier.yml (PR-only), the release legs in
# build.yml, and Gradle -- whose two caches were removed after being shown to have never stored
# anything (see the note in build.yml's job-android-nextest).
#
# Watch item: before the rename, the four test legs ran uncapped and reached ~2 GiB with Rust hit
# rates of 85-98%. They are now capped at 1 GiB, roughly half their natural working set, so some
# hit-rate loss is expected. The budget above has ~3 GiB of slack against the 10 GiB quota if the
# cap needs raising.
#
# Why keep 1 for sccache: restore-keys already pick the newest matching prefix, so an older
# entry is never chosen while a newer one exists. It is safe because saves are `if: always()`
# and every job restores before it saves -- so a run that fails early still saves at least what
# it restored, never a regression. Why keep 2 for the lockfile-keyed families: those keys change
# only when dependencies change, and keeping the previous lockfile's entry means a revert or a
# concurrent branch on the old lockfile still hits.

permissions:
  actions: write
  contents: read

on:
  schedule:
    # 03:17 UTC, offset off the hour so it does not contend with the hourly scheduling spike.
    - cron: "17 3 * * *"
  # Sweep right after the full matrix has finished saving, so superseded entries do not sit in
  # the quota until the next nightly run. `workflow_run` executes in the default branch's
  # context, which is what gives it the `actions: write` needed to delete.
  workflow_run:
    workflows: ["Ahma"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting it"
        type: boolean
        default: false

concurrency:
  # Never let two sweeps race: both would compute keep-lists from the same snapshot and the
  # second would delete entries the first already replaced.
  group: cache-janitor
  cancel-in-progress: false

jobs:
  prune:
    name: Prune superseded caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      # Set to 1 in a workflow_dispatch to see what would be deleted without deleting it.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - name: Prune
        run: |
          set -euo pipefail

          # id, ref, key, created_at, size. Tab-separated; keys never contain tabs.
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" --paginate \
            --jq '.actions_caches[] | [.id, .ref, .key, .created_at, .size_in_bytes] | @tsv' \
            > all-caches.tsv || true

          if [ ! -s all-caches.tsv ]; then
            echo "No caches to prune."
            exit 0
          fi

          # Totals come from the enumerated list, not from the cache/usage endpoint: the two
          # disagree (usage reported 9 entries / 10.12 GiB while the list held 18), and the list
          # is what this job can actually act on. usage is reported alongside as GitHub's own
          # accounting, which is what the quota is enforced against.
          before_count="$(wc -l < all-caches.tsv | tr -d ' ')"
          before_bytes="$(awk -F'\t' '{n+=$5} END {print n+0}' all-caches.tsv)"
          usage_bytes="$(gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" --jq '.active_caches_size_in_bytes' 2>/dev/null || echo 0)"
          printf 'Before: %s entries, %.2f GiB listed (%.2f GiB per GitHub usage API)\n' \
            "$before_count" \
            "$(echo "$before_bytes" | awk '{print $1/1073741824}')" \
            "$(echo "$usage_bytes" | awk '{print $1/1073741824}')"

          # Reduce a key to its family by stripping the variable tail segments that build.yml
          # appends: run_attempt and run_id (all-digit fields, innermost first), then a
          # hashFiles digest (64 hex chars). What remains identifies the cache's purpose, e.g.
          # sccache-test-Linux-X64 or cargo-registry-macOS-ARM64.
          family_of() {
            local k="$1"
            while [ "$k" != "${k%-*}" ] && printf '%s' "${k##*-}" | grep -Eq '^[0-9]+$'; do
              k="${k%-*}"
            done
            if printf '%s' "${k##*-}" | grep -Eq '^[0-9a-f]{64}$'; then
              k="${k%-*}"
            fi
            printf '%s' "$k"
          }

          # Retired key schemes from the daily-rotation era. These form their own families under
          # family_of (nothing strips a `-day220` suffix), so keep-N would preserve them
          # forever. They are dead on arrival -- no workflow writes these prefixes any more.
          is_retired() {
            case "$1" in
              *-day[0-9]*) return 0 ;;
              cargo-registry-test-* | cargo-registry-android-* | cargo-registry-coverage-* | cargo-registry-release-*) return 0 ;;
              sccache-release-* | gradle-deeper-*) return 0 ;;
              *) return 1 ;;
            esac
          }

          keep_for() {
            case "$1" in
              # Lockfile/build-script keyed: cheap, and the previous generation still hits after
              # a revert or on a concurrent branch that has not taken the dep bump.
              # gradle-deps-* is retained only so a future re-add is handled; nothing writes it.
              cargo-registry-* | gradle-deps-*) echo 2 ;;
              # Run-scoped and large: restore-keys always pick the newest, so one is enough.
              sccache-* | gradle-android-build-*) echo 1 ;;
              # Unknown family (a new cache added without updating this table): keep 2 and warn
              # rather than silently deleting someone's cache down to one copy.
              *) echo 2 ;;
            esac
          }

          # Group by (ref, family) rather than family alone. The same key can exist on several
          # refs, and a PR-scoped entry must never count towards main's keep budget or vice
          # versa -- that would let one branch evict another's cache.
          : > grouped.tsv
          : > retired.tsv
          while IFS=$'\t' read -r id ref key created size; do
            [ -n "${id:-}" ] || continue
            if is_retired "$key"; then
              printf '%s\t%s\t%s\n' "$id" "$key" "$size" >> retired.tsv
              continue
            fi
            fam="$(family_of "$key")"
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$ref" "$fam" "$created" "$id" "$key" "$size" >> grouped.tsv
          done < all-caches.tsv

          delete_one() {
            local id="$1" key="$2" size="$3" why="$4"
            printf '  %-8s %10.1f MiB  %s  (%s)\n' \
              "$([ "$DRY_RUN" = "true" ] && echo "WOULD" || echo "DELETE")" \
              "$(echo "$size" | awk '{print $1/1048576}')" "$key" "$why"
            if [ "$DRY_RUN" != "true" ]; then
              # A concurrent run may have deleted it already; that is not a failure.
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" --silent 2>/dev/null || true
            fi
          }

          freed=0
          deleted=0

          if [ -s retired.tsv ]; then
            echo "Retired key schemes (daily rotation era):"
            while IFS=$'\t' read -r id key size; do
              delete_one "$id" "$key" "$size" "retired scheme"
              freed=$((freed + size))
              deleted=$((deleted + 1))
            done < retired.tsv
          fi

          if [ -s grouped.tsv ]; then
            echo "Superseded entries (keeping newest per family):"
            # Sort by ref, family, then created_at DESCENDING so the newest in each group is
            # seen first and the keep counter can drop everything after the Nth.
            sort -t$'\t' -k1,1 -k2,2 -k3,3r grouped.tsv > sorted.tsv
            prev_group=""
            seen=0
            keep=0
            while IFS=$'\t' read -r ref fam created id key size; do
              group="$ref|$fam"
              if [ "$group" != "$prev_group" ]; then
                prev_group="$group"
                seen=0
                keep="$(keep_for "$fam")"
              fi
              seen=$((seen + 1))
              if [ "$seen" -gt "$keep" ]; then
                delete_one "$id" "$key" "$size" "#$seen of $fam on $ref, keep $keep"
                freed=$((freed + size))
                deleted=$((deleted + 1))
              fi
            done < sorted.tsv
          fi

          printf '\n%s %s entries, %.2f GiB\n' \
            "$([ "$DRY_RUN" = "true" ] && echo "Would free" || echo "Freed")" \
            "$deleted" "$(echo "$freed" | awk '{print $1/1073741824}')"

          {
            echo "### Cache janitor"
            echo
            printf 'Before: **%s** entries, **%.2f GiB** of the 10 GiB quota\n\n' \
              "$before_count" "$(echo "$before_bytes" | awk '{print $1/1073741824}')"
            printf 'Steady-state target is ~7.4 GiB; see the budget table in this workflow.\n\n'
            printf '%s **%s** entries, **%.2f GiB**\n' \
              "$([ "$DRY_RUN" = "true" ] && echo 'Would free' || echo 'Freed')" \
              "$deleted" "$(echo "$freed" | awk '{print $1/1073741824}')"
          } >> "$GITHUB_STEP_SUMMARY"
