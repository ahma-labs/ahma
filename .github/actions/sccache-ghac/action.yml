name: Set up sccache on the GitHub Actions cache backend
description: >-
  Installs sccache and points it at its native GitHub Actions cache backend (ghac), which stores
  each compilation object as its own Actions cache entry instead of tarring SCCACHE_DIR into one.
  This is the ONLY place ghac is switched on; see the caching note at the top of build.yml.

inputs:
  mode:
    description: >-
      `read-write` (default) for main-branch jobs that should populate the cache, or `read-only`
      for PR jobs. `read-only` is rule 1 of the caching note enforced by sccache itself rather
      than by the convention of omitting a save step.
    required: false
    default: read-write
  extra-tools:
    description: >-
      Comma-separated extra tools to hand to taiki-e/install-action alongside sccache, so a job
      needs one install step rather than two (e.g. `nextest,cargo-llvm-cov`).
    required: false
    default: ""

runs:
  using: composite
  steps:
    # ghac needs credentials, and the runner exposes those only to JavaScript actions, not to
    # `run:` steps -- hence github-script + exportVariable.
    #
    # ACTIONS_CACHE_SERVICE_V2 is load-bearing and is NOT in the requirement list in #562.
    # opendal picks the API version from that variable alone (`get_cache_service_version`:
    # non-empty -> V2, empty -> V1) and only V2 reads ACTIONS_RESULTS_URL; V1 tries
    # ACTIONS_CACHE_URL first and talks to the retired `_apis/artifactcache` endpoints. Export
    # the URL and token without it and sccache lands on the dead v1 service, fails every write,
    # degrades to read-only and stays green -- #561's exact shape. So this step asserts on all
    # three inputs rather than defaulting them to "" the way opendal's own README snippet does;
    # an empty ACTIONS_CACHE_URL is worse than an unset one, because V1's `or_else` fallback to
    # ACTIONS_RESULTS_URL only fires when the variable is absent, not when it is set to empty.
    - name: Export Actions cache credentials for sccache (ghac)
      uses: actions/github-script@v9
      with:
        script: |
          const url = process.env.ACTIONS_RESULTS_URL;
          const token = process.env.ACTIONS_RUNTIME_TOKEN;
          if (!url || !token) {
            core.setFailed(
              'ACTIONS_RESULTS_URL / ACTIONS_RUNTIME_TOKEN are not visible to this action, so ' +
              'sccache cannot reach the ghac backend. It would silently fall back to the disk ' +
              'cache. See the ghac section of the caching note in build.yml.');
            return;
          }
          core.setSecret(token);
          core.exportVariable('ACTIONS_RESULTS_URL', url);
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', token);
          // Forced on rather than defaulted off: v1 is decommissioned on github.com, so an
          // absent flag can only mean the runner stopped advertising it, never that v1 is the
          // right choice here. Warn so the reason is in the log if this ever starts happening.
          if (!process.env.ACTIONS_CACHE_SERVICE_V2) {
            core.warning(
              'ACTIONS_CACHE_SERVICE_V2 was not set by the runner; forcing it on so opendal ' +
              'uses the v2 cache service. If ghac reads/writes start failing, check whether ' +
              'the runner renamed this flag.');
          }
          core.exportVariable('ACTIONS_CACHE_SERVICE_V2', process.env.ACTIONS_CACHE_SERVICE_V2 || 'true');

    # Written to GITHUB_ENV rather than to each caller's `env:` block so there is exactly one
    # switch in the repo. sccache reads its config when the server starts, and the server starts
    # lazily at the first compile request, so exporting it here is early enough for every caller.
    #
    # `on` is what sccache's docs use. Unlike SCCACHE_MAX_SIZE in #561, a wrong value here cannot
    # fail silently: `bool_from_env_var` accepts true/on/1/false/off/0 case-insensitively and
    # `bail!`s on anything else, and `Config::load()` propagates that, so sccache refuses to start
    # rather than quietly ignoring the setting.
    #
    # SCCACHE_GHA_VERSION (the manual purge knob) is deliberately NOT set: sccache enables ghac on
    # that variable's mere presence and skips reading SCCACHE_GHA_ENABLED entirely, so setting it
    # would create a second, hidden way for ghac to be on while the line below says it is off.
    - name: Enable the ghac backend
      shell: bash
      # Through `env:` rather than `${{ }}` interpolated into the script: an input expanded into
      # shell source is a script-injection surface, and it also makes the script unreadable to
      # shellcheck.
      env:
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        case "$MODE" in
          read-write) ;;
          read-only)  echo "SCCACHE_GHA_RW_MODE=READ_ONLY" >> "$GITHUB_ENV" ;;
          *)
            echo "::error::sccache-ghac: mode must be read-write or read-only, got '$MODE'"
            exit 1
            ;;
        esac
        echo "SCCACHE_GHA_ENABLED=on" >> "$GITHUB_ENV"

    # sccache is version-pinned HERE, once, for every caller -- and the single pin is the point,
    # not an incidental tidiness. Three reasons, in increasing order of how quietly they fail:
    #   - The ghac backend needs >= v0.11.0 (v0.10.0 spoke ghac API v2, v0.11.0 moved to v4 and
    #     the docs say earlier versions "probably will not work").
    #   - sccache namespaces its ghac objects as `sccache-v{VERSION}`, so an unpinned upgrade
    #     silently cold-starts the cache and reads as a regression.
    #   - For the same reason, two CALLERS on different versions never share an object. Pinning
    #     each job separately would therefore be a latent bug the moment the pins drifted; one
    #     pin for all of them is what keeps fast-tier.yml reading what build.yml wrote.
    # `@0.17` tracks the 0.17.x series; taiki-e/install-action has no ">=" syntax, so a series pin
    # is how a floor is expressed.
    #
    # TEMPORARY, and the whole point of this branch: `sccache` is NOT in this list right now. It
    # is built from source below instead, from the patched fork under test. Reverting this
    # experiment means putting `sccache@0.17` back at the front of `tool:` and deleting the two
    # steps that follow. Everything else in this action is unchanged.
    #
    # Revert when: mozilla/sccache#2821 lands in a released sccache version, or by January 2027 if
    # it has not landed by then, whichever comes first -- see the "EXPERIMENTAL FORK OF SCCACHE"
    # note in build.yml (and SPEC.md R13.2.8) for the full revert checklist.
    - name: Install workflow tools
      if: inputs.extra-tools != ''
      uses: taiki-e/install-action@v2
      with:
        tool: ${{ inputs.extra-tools }}

    # sccache under test: paulirotta/sccache@gha-retry-layer, the candidate fix for
    # mozilla/sccache#2821 (GHACache::build installs no RetryLayer, so a ghac 429 kills a write
    # outright). Pinned to a commit, not a branch: the cache key below is only honest if the ref
    # cannot move under it, and two jobs on different sccache builds would not share a ghac object
    # anyway -- the same reason the release pin above is single-sourced.
    #
    # `--no-default-features --features gha` builds the one backend this repo uses. It is also
    # what keeps the build tractable on a runner: the default feature set pulls every backend
    # (s3, gcs, azure, redis, memcached, webdav, oss, cos, dist-client) and their transitive
    # crypto stacks. The version string is unchanged at 0.17.0, so this binary reads and writes
    # the SAME `sccache-v0.17.0` ghac namespace as the released one -- deliberately, because the
    # comparison against the runs in mozilla/sccache#2821 only holds if the objects are the same.
    - name: Cache the patched sccache build
      id: sccache-patched-cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/bin/sccache
          ~/.cargo/bin/sccache.exe
        key: sccache-patched-${{ runner.os }}-${{ runner.arch }}-ba87de4abb66f08d7d3466962230239aafc8629e

    - name: Build the patched sccache
      if: steps.sccache-patched-cache.outputs.cache-hit != 'true'
      shell: bash
      # RUSTC_WRAPPER is `sccache` for every job in these workflows, so building sccache with it
      # set would ask cargo to invoke a binary that does not exist yet. Unset for this step only.
      env:
        RUSTC_WRAPPER: ""
      run: |
        set -euo pipefail
        cargo install \
          --git https://github.com/paulirotta/sccache \
          --rev ba87de4abb66f08d7d3466962230239aafc8629e \
          --locked \
          --no-default-features --features gha \
          sccache

    # Every ghac failure mode is silent, so the retry layer has to be observable or this branch
    # proves nothing: a run with zero write errors because the fix worked looks exactly like a run
    # with zero write errors because nothing was ever throttled. opendal's RetryLayer logs each
    # retry at warn under target `opendal::layers::retry`, and sccache routes its server log to
    # SCCACHE_ERROR_LOG. `sccache-verify` counts those lines and reports them next to the write
    # errors, which is what turns "no errors" into "N requests were throttled and N recovered".
    - name: Capture the sccache server log
      shell: bash
      run: |
        set -euo pipefail
        echo "SCCACHE_ERROR_LOG=${RUNNER_TEMP}/sccache-server.log" >> "$GITHUB_ENV"
        echo "SCCACHE_LOG=warn" >> "$GITHUB_ENV"

    # TEMPORARY, same experiment as the two steps above: the server's own startup probe
    # (`.sccache_check`, src/cache/cache.rs) is written through the same retried operator as
    # everything else, and the client only waits sccache's fixed SERVER_STARTUP_TIMEOUT (10s,
    # src/commands.rs) for that probe to resolve before giving up on the whole server. Cold run
    # 32631888674 hit exactly that: two of five jobs died with "Timed out waiting for server
    # startup" because the tuned retry budget (up to ~31s across 6 attempts, more with jitter) can
    # outlast the client's patience when the probe itself lands in a long rate-limit window --
    # which is the likeliest moment for that to happen, since every job's server starts and probes
    # at once. Not overridable by a plain env var (SCCACHE_CONF picks a config *file*, config.rs),
    # so this generates one. Revert together with the two steps above -- delete this step too.
    # Same revert condition as those steps: mozilla/sccache#2821 landing, or January 2027.
    - name: Raise the sccache server-startup timeout
      shell: bash
      run: |
        set -euo pipefail
        conf="${RUNNER_TEMP}/sccache-config.toml"
        echo "server_startup_timeout_ms = 90000" > "$conf"
        echo "SCCACHE_CONF=${conf}" >> "$GITHUB_ENV"
