[package]
authors.workspace = true
edition.workspace = true
license.workspace = true
name = "ahma_harness_tools"
description = "Scope-validated file I/O, glob and regex search, and web-page fetch utilities backing the ahma MCP harness tools (MIT OR Apache-2.0)."
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "ahma_harness_tools"
path = "src/lib.rs"

[dependencies]
ahma_common = { path = "../ahma_common" }
anyhow.workspace = true
globset = "0.4"
html2text = "0.17"
# .gitignore-aware walking for grep_search / file_search (ripgrep's walker).
ignore = "0.4"
regex.workspace = true
reqwest = { workspace = true, features = ["rustls", "json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tempfile.workspace = true
