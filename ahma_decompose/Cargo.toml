[package]
authors.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
name = "ahma_decompose"
readme.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Local-LLM decompose orchestration for ahma: split questions into sub-tasks, dispatch concurrently, aggregate with deterministic reducers."

[lib]
name = "ahma_decompose"
path = "src/lib.rs"

[dependencies]
ahma_llm_monitor = { path = "../ahma_llm_monitor" }
ahma_vault = { path = "../ahma_vault" }
anyhow.workspace = true
futures.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
