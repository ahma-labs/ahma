[package]
authors.workspace = true
edition.workspace = true
license.workspace = true
name = "ahma_vault"
description = "Task Vault for ahma: per-task isolated working directories with a kernel-sandbox scope, two-phase trash (rm interception) and an append-only JSONL audit log (MIT OR Apache-2.0)."
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
ahma_common = { path = "../ahma_common" }
anyhow.workspace = true
chrono.workspace = true
rand = "0.10.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
