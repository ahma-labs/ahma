[package]
authors.workspace = true
edition.workspace = true
license.workspace = true
name = "ahma_core"
readme.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Core library for embedding ahma's sandbox and MCP service in other Rust applications (MIT OR Apache-2.0). AGPL-licensed feature crates (ahma_tui) are available separately."

[lib]
name = "ahma_core"
path = "src/lib.rs"

[dependencies]
parking_lot.workspace = true
ahma_mcp = { path = "../ahma_mcp" }
ahma_common = { path = "../ahma_common" }
ahma_http_mcp_client = { path = "../ahma_http_mcp_client" }
ahma_llm_monitor = { path = "../ahma_llm_monitor" }
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
# Curated from what src/ actually uses (sync, net, time, spawn, select!, fs, main/test)
# on top of the workspace list — `"full"` bypassed the workspace's feature curation.
tokio = { workspace = true, features = ["sync", "net", "time"] }
tracing.workspace = true
reqwest = { workspace = true, features = ["json", "rustls"] }
uuid.workspace = true
futures.workspace = true
async-trait.workspace = true
dirs.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
axum = { version = "0.8", features = ["tokio"] }
tempfile.workspace = true
