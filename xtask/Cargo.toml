[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
jiff = { version = "0.2.43", default-features = false, features = ["std"] }
regex = "1.13.1"
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = "3"
