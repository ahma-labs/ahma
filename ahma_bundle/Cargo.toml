[package]
authors.workspace = true
edition.workspace = true
license.workspace = true
name = "ahma_bundle"
description = "MTDF tool-bundle supply-chain audit (`ahma bundle audit`), SHA-256 content manifests (`ahma bundle checksum`/`verify`) (MIT OR Apache-2.0)."
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
ahma_common = { path = "../ahma_common" }
anyhow.workspace = true
reqwest = { workspace = true, features = ["json", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tempfile.workspace = true
