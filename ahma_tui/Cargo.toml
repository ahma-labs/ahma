[package]
authors.workspace = true
edition.workspace = true
license = "AGPL-3.0-or-later"
name = "ahma_tui"
readme.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Terminal dashboard (ratatui) for ahma: monitor active operations and handle approval gates."

[lib]
name = "ahma_tui"
path = "src/lib.rs"

[dependencies]
ahma_common = { path = "../ahma_common" }
ahma_renewal = { path = "../ahma_renewal" }
anyhow.workspace = true
chrono = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "time",
    "net",
] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
