[workspace]
# Edition-2024 members imply resolver 3; set it explicitly to silence cargo's
# "virtual workspace defaulting to resolver = 1" warning and use the v3 resolver.
resolver = "3"
# default-members equals members (minus dev-only xtask): a plain `cargo build`
# builds the whole product. The permissive crates (MIT OR Apache-2.0) form the
# embeddable engine; the AGPL-3.0 crates are the end-user product
# surface. ahma_bin gates simplify behind a cargo feature (on by default).
default-members = [
    # Permissive crates (MIT OR Apache-2.0)
    "ahma_mcp",
    "generate_tool_schema",
    "ahma_http_bridge",
    "ahma_http_mcp_client",
    "ahma_common",
    "ahma_llm_monitor",
    "ahma_core",
    "ahma_bundle",
    "ahma_update",
    "ahma_vault",
    "ahma_log_monitor",
    "ahma_harness_guard",
    "ahma_output_optimizer",
    "ahma_simplify",
    "ahma_test_support",
    "ahma_harness_tools",
    # AGPL-3.0 crates (end-user product surface)
    "ahma_tui",
    "ahma_bin",
]

members = [
    # Permissive crates (MIT OR Apache-2.0)
    "ahma_mcp",
    "generate_tool_schema",
    "ahma_http_bridge",
    "ahma_http_mcp_client",
    "ahma_common",
    "ahma_llm_monitor",
    "ahma_core",
    "ahma_bundle",
    "ahma_update",
    "ahma_vault",
    "ahma_log_monitor",
    "ahma_harness_guard",
    "ahma_output_optimizer",
    "ahma_simplify",
    "ahma_test_support",
    "ahma_harness_tools",
    # AGPL-3.0 crates (end-user product surface)
    "ahma_tui",
    "ahma_bin",
    # cargo-hakari workspace-hack: pins one third-party feature set for every
    # invocation so `-p` builds reuse the workspace build's artifacts. Managed by
    # `cargo hakari generate`; see .config/hakari.toml for the measurements.
    "workspace-hack",
    # dev-only workspace automation (not published, not in default-members)
    "xtask",
]

[workspace.package]
authors = ["Paul Houghton <paulirotta@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
rust-version = "1.95.0"
version = "0.21.3"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
dirs = "6.0"
dunce = "1.0"
futures = "0.3.34"
hmac = "0.13.0"
landlock = "0.4.7"
opentelemetry = { version = "0.32.0", features = ["trace"] }
# Locks that cannot be poisoned.
#
# std's Mutex/RwLock return a Result whose Err means "a thread panicked while
# holding this", and the workspace's answer at ~260 call sites was `.unwrap()` —
# so one panic anywhere under a lock turned a degraded server into a permanently
# broken one: every subsequent request panicked on the poisoned lock, including
# the request paths that had nothing to do with the original fault. parking_lot
# has no poisoning, so the failure mode does not exist rather than being handled
# at every call site. Already in the tree via crossterm; MIT OR Apache-2.0.
parking_lot = "0.12.5"
# Windows-only kernel binding crate (only fetched when compiling for Windows)
libc = "0.2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
opentelemetry-otlp = { version = "0.32.0", features = [
    "http-proto",
    "reqwest-rustls",
] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false }
rmcp = { version = "2.2.0", features = [
    "server",
    "client",
    "macros",
    "transport-io",
    "transport-child-process",
    "elicitation",
    "schemars",
    "transport-streamable-http-client-unix-socket",
] }
rustc-hash = "2.1"
schemars = "1.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = "0.30.2"
tui-textarea = { package = "tui-textarea-2", version = "0.10.2", features = [
    "crossterm",
] }
serde = "1.0"
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.11.0"
subtle = "2.6"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "process",
    "fs",
    "signal",
] }
tokio-util = "0.7.19"
toml = "1.1"
uuid = { version = "1.26.1", features = ["v4"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5"

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1

[profile.test.package."*"]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
