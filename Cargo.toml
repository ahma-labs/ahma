[workspace]
# Edition-2024 members imply resolver 3; set it explicitly to silence cargo's
# "virtual workspace defaulting to resolver = 1" warning and use the v3 resolver.
resolver = "3"
# default-members equals members (minus dev-only xtask): a plain `cargo build`
# builds the whole product. The permissive crates (MIT OR Apache-2.0) form the
# embeddable engine; the AGPL-3.0-or-later crates are the end-user product
# surface. ahma_bin gates vault/cluster/simplify behind cargo features.
default-members = [
    # Permissive crates (MIT OR Apache-2.0)
    "ahma_mcp",
    "generate_tool_schema",
    "ahma_http_bridge",
    "ahma_http_mcp_client",
    "ahma_common",
    "ahma_llm_monitor",
    "ahma_core",
    "ahma_test_support",
    "ahma_harness_tools",
    # AGPL-3.0-or-later crates (end-user product surface)
    "ahma_vault",
    "ahma_task_tree",
    "ahma_tui",
    "ahma_bin",
    # AGPL-3.0-or-later (network-facing cluster scheduler)
    "ahma_cluster",
]

members = [
    # Permissive crates (MIT OR Apache-2.0)
    "ahma_mcp",
    "generate_tool_schema",
    "ahma_http_bridge",
    "ahma_http_mcp_client",
    "ahma_common",
    "ahma_llm_monitor",
    "ahma_core",
    "ahma_test_support",
    "ahma_harness_tools",
    # AGPL-3.0-or-later crates (end-user product surface)
    "ahma_vault",
    "ahma_task_tree",
    "ahma_tui",
    "ahma_bin",
    # AGPL-3.0-or-later (network-facing cluster scheduler)
    "ahma_cluster",
    # dev-only workspace automation (not published, not in default-members)
    "xtask",
]

[workspace.package]
authors = ["Paul Houghton <paulirotta@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
rust-version = "1.95.0"
version = "0.19.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1.89"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
directories = "6.0"
dirs = "6.0"
dunce = "1.0"
futures = "0.3.32"
hmac = "0.13.0"
landlock = "0.4.5"
opentelemetry = { version = "0.32.0", features = ["trace"] }
# Windows-only kernel binding crate (only fetched when compiling for Windows)
libc = "0.2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
opentelemetry-otlp = { version = "0.32.0", features = [
    "http-proto",
    "reqwest-rustls",
] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
regex = "1.12"
reqwest = { version = "0.13.4", default-features = false }
rmcp = { version = "2.2.0", features = [
    "server",
    "client",
    "macros",
    "transport-io",
    "transport-child-process",
    "elicitation",
    "schemars",
    "transport-streamable-http-client-unix-socket",
] }
schemars = "1.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = "0.30.2"
tui-textarea = { package = "tui-textarea-2", version = "0.10.2", features = [
    "crossterm",
] }
serde = "1.0"
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.11.0"
subtle = "2.6"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.52", features = [
    "macros",
    "rt-multi-thread",
    "process",
    "fs",
    "signal",
] }
tokio-util = "0.7.18"
toml = "1.1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5"

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1

[profile.test.package."*"]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

