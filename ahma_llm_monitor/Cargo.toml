[package]
authors.workspace = true
edition.workspace = true
license.workspace = true
name = "ahma_llm_monitor"
description = "OpenAI-compatible LLM client for log analysis, streaming chat, and local-provider discovery. Used by the ahma live-log monitor pipeline (MIT OR Apache-2.0)."
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
ahma_common = { path = "../ahma_common" }
bytes = "1"
futures.workspace = true
reqwest = { workspace = true, features = ["json", "rustls", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
