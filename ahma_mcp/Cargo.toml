[package]
authors.workspace = true
edition.workspace = true
license.workspace = true
name = "ahma_mcp"
description = "MCP server engine with kernel-enforced sandbox (Landlock/Seatbelt/Job Objects), async shell pool, and operation tracking. Core of the ahma AI-agent execution platform (MIT OR Apache-2.0)."
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[lints.rust]
deprecated = "allow"

[lib]
name = "ahma_mcp"
path = "src/lib.rs"


[dependencies]
parking_lot.workspace = true
ahma_common = { path = "../ahma_common" }
ahma_bundle = { path = "../ahma_bundle" }
ahma_harness_guard = { path = "../ahma_harness_guard" }
ahma_harness_tools = { path = "../ahma_harness_tools" }
ahma_http_bridge = { path = "../ahma_http_bridge" }
ahma_http_mcp_client = { path = "../ahma_http_mcp_client" }
ahma_llm_monitor = { path = "../ahma_llm_monitor" }
ahma_log_monitor = { path = "../ahma_log_monitor" }
ahma_output_optimizer = { path = "../ahma_output_optimizer" }
ahma_update = { path = "../ahma_update" }
ahma_vault = { path = "../ahma_vault" }
anyhow.workspace = true
async-trait.workspace = true
base64 = "0.22"
chrono.workspace = true
clap.workspace = true
ctrlc.workspace = true
dirs.workspace = true
dunce.workspace = true
futures.workspace = true
rand = "0.10.1"
regex.workspace = true
reqwest = { workspace = true, features = ["json", "rustls", "http2", "http3"] }
rmcp.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Cross-platform process-tree CPU sampling for the operation liveness watchdog:
# "no output" is not "no progress" (a `| tail` pipeline buffers, a compile is silent),
# so the watchdog asks whether the process tree is still burning CPU before killing it.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tempfile.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
tokio.workspace = true
toml.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
url.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
ahma_test_support = { path = "../ahma_test_support" }
futures.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"

[features]
# Deliberately almost no features — this crate has exactly one flavour by
# default. A feature is part of a crate's fingerprint even when it gates
# nothing, so any feature on the workspace's critical-path crate that one
# invocation enables and another does not (`cargo build` vs
# `cargo build -p ahma_mcp`) forces a second compile of ahma_mcp and a second
# link of every one of its test binaries. Two features used to live here:
#   - a no-op `android = []` that CI toggled to *select* the Android/Kotlin test
#     group — select test groups with a nextest filter
#     (`-E 'test(kotlin) or test(android)'`), never with a feature;
#   - `simplify`, the code-complexity analyzer and its rust-code-analysis tree —
#     now the `ahma_simplify` crate, an optional dependency of `ahma_bin` only.
#
# `otel` is the one deliberate exception: it forwards to `ahma_common/otel`
# (the ~200-crate OpenTelemetry SDK subtree), off by default so it costs
# nothing on a normal dev/test/clippy cycle. Unlike `android`/`simplify`
# above it cannot be pushed out to `ahma_bin` — the code that calls
# `ahma_common::observability::create_otel_layer` lives inside this crate
# (`src/utils/logging.rs`), not in an optional sibling crate — so this crate
# does pay a second flavour, but only when CI or a release build asks for it.
default = []
otel = ["ahma_common/otel"]

# Tool configuration examples
[[example]]
name = "rust_tool"
path = "examples/rust_tool.rs"

[[example]]
name = "file-tools"
path = "examples/file-tools.rs"

