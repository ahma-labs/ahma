[package]
authors.workspace = true
edition.workspace = true
license.workspace = true
name = "ahma_mcp"
description = "MCP server engine with kernel-enforced sandbox (Landlock/Seatbelt/Job Objects), async shell pool, and operation tracking. Core of the ahma AI-agent execution platform (MIT OR Apache-2.0)."
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[lints.rust]
deprecated = "allow"

[lib]
name = "ahma_mcp"
path = "src/lib.rs"


[dependencies]
ahma_common = { path = "../ahma_common" }
ahma_harness_tools = { path = "../ahma_harness_tools" }
ahma_http_bridge = { path = "../ahma_http_bridge" }
ahma_http_mcp_client = { path = "../ahma_http_mcp_client" }
ahma_llm_monitor = { path = "../ahma_llm_monitor" }
anyhow.workspace = true
async-trait.workspace = true
base64 = "0.22"
chrono.workspace = true
clap.workspace = true
ctrlc.workspace = true
directories.workspace = true
dirs.workspace = true
dunce.workspace = true
flate2 = "1.1"
futures.workspace = true
notify = "8.2"
opentelemetry-otlp = { workspace = true }
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true }
opener = { version = "0.8", optional = true }
pulldown-cmark = { version = "0.13", optional = true }
quick-xml = { version = "0.41", optional = true }
rand = "0.10.1"
regex.workspace = true
reqwest = { workspace = true, features = ["json", "rustls", "http2", "http3"] }
rmcp.workspace = true
rust-code-analysis = { package = "rust-code-analysis-code-split", version = "0.0.26-cs.0", optional = true }
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ring = { version = "0.17", features = ["std"] }
sha2 = "0.11.0"
# Cross-platform process-tree CPU sampling for the operation liveness watchdog:
# "no output" is not "no progress" (a `| tail` pipeline buffers, a compile is silent),
# so the watchdog asks whether the process tree is still burning CPU before killing it.
sysinfo = { version = "0.39.5", default-features = false, features = ["system"] }
sigstore-verification = { version = "0.2", default-features = false, features = [
	"rustls",
] }
tar = "0.4"
tempfile.workspace = true
# Only `deflate` is used: we extract our own release .zip (produced by `7z a`,
# which emits deflate) and write deflate zips in tests. zip's default features
# additionally pull in bzip2, aes-crypto, lzma, zstd, xz, ppmd and deflate64 —
# dead weight, and bzip2's licence is not on the `cargo deny` allow-list.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
thiserror.workspace = true
tokio-util.workspace = true
tokio = "1.52"
toml.workspace = true
tracing-appender.workspace = true
tracing-opentelemetry = { workspace = true }
tracing-subscriber.workspace = true
tracing.workspace = true
url.workspace = true
walkdir = { version = "2.5", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
ahma_test_support = { path = "../ahma_test_support" }
futures.workspace = true
tempfile.workspace = true
tokio = { version = "1.52", features = ["test-util"] }
wiremock = "0.6"

[features]
# Selects the Android/Kotlin test group in CI (`--features android`).
# Gates no library code; retained solely as the CI test selector.
android = []
# Code complexity analysis: depends on rust-code-analysis,
# so it stays behind a feature gate for lean builds.
simplify = [
	"dep:opener",
	"dep:pulldown-cmark",
	"dep:quick-xml",
	"dep:rust-code-analysis",
	"dep:walkdir",
]
default = ["android"]

# Integration tests that require non-default features
[[test]]
name = "simplify_report_integration_test"
required-features = ["simplify"]

# Tool configuration examples
[[example]]
name = "rust_tool"
path = "examples/rust_tool.rs"

[[example]]
name = "file-tools"
path = "examples/file-tools.rs"

[[example]]
name = "gh_tool"
path = "examples/gh_tool.rs"

[[example]]
name = "git_tool"
path = "examples/git_tool.rs"

[[example]]
name = "kotlin_tool"
path = "examples/kotlin_tool.rs"

[[example]]
name = "python_tool"
path = "examples/python_tool.rs"
