# sccache sandbox profile: one compile-cache server per workspace.
#
# sccache runs a long-lived server that every compiler call in a build talks
# to. A server started by a sandboxed build inherits that build's sandbox, so
# it can write only the checkout it was started in — and every other checkout
# on this machine then fails to compile through it (SPEC R-DOCTOR.7). Giving
# each workspace its own server, cache and port means a server born confined
# only ever serves the checkout it can write.
#
# These are variables, not grants: the cache lives inside the workspace, so no
# path outside it is opened. A variable you set yourself (a shared SCCACHE_DIR,
# your own port) is never overridden (SPEC R-PERM.5.5).
name = "sccache"
description = "sccache: a compile-cache server, cache and port of its own per workspace"
rules = []

# Only where sccache compiles this workspace: the compiler wrapper names it, in
# the environment or in cargo's configuration. Anywhere else these variables
# would only create an empty `.sccache` in every project.
[[when]]
env = "RUSTC_WRAPPER"
contains = "sccache"

[[when]]
env = "CARGO_BUILD_RUSTC_WRAPPER"
contains = "sccache"

[[when]]
file = "${WORKSPACE}/.cargo/config.toml"
contains = "sccache"

[[when]]
file = "${CARGO_HOME:-~/.cargo}/config.toml"
contains = "sccache"

# A cache location set in sccache's own config file is overridden on purpose:
# a server started inside the sandbox can write only the workspace, so a cache
# anywhere else would fail every sandboxed build. A variable you set yourself
# still wins (SPEC R-PERM.5.5).

[[env]]
name = "SCCACHE_DIR"
value = "${WORKSPACE}/.sccache"
cache_dir = true
reason = "the cache lives inside the workspace, which a sandboxed server can write; ahma marks the directory ignored by git and by backups (delete it any time)"

[[env]]
name = "SCCACHE_CACHE_SIZE"
value = "4G"
reason = "each workspace has a cache of its own, so each is bounded rather than taking sccache's default 10G per checkout"

[[env]]
name = "SCCACHE_SERVER_PORT"
value = "${WORKSPACE_PORT}"
reason = "a port of this workspace's own, so its builds never reach a server confined to another checkout"
