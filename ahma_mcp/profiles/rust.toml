# Rust toolchain sandbox profile.
#
# A profile is nothing more than a *pre-answered bundle of grant questions*: the
# same paths a user would end up granting one denial at a time, shipped so they
# do not have to. That is why it is data, not code — it can be read, disabled,
# and copied by anyone who needs a different toolchain (SPEC R-PERM.5).
name = "rust"
description = "Rust toolchain: cargo registry/git caches, rustup toolchains"

# What enabling this costs, shown beside the profile by `ahma permissions list`
# (SPEC R-PERM.5.2). This one is not generic hardening advice — it is the named
# residual risk of R-HANDOFF.8, and it is stated here rather than in the docs
# because a grant whose consequence is invisible is not meaningfully refusable.
#
# The cargo registry and git caches are machine-global: every project on this
# machine shares them. Cargo genuinely needs write access (it extracts .crate
# archives into registry/src and materialises git dependencies), so this is a
# real requirement, not an oversight. The consequence follows directly.
cost = """the cargo registry and git caches are shared by every project on this machine, and \
this profile makes them writable. An agent working in one project can edit the extracted source \
of a cached crate, and that edited code is then compiled and executed — as a build script or proc \
macro — the next time you build an unrelated project. Turn it off with `--no-package-cache-write` \
(or `[sandbox] package_cache_write = false`), which downgrades these caches to read-only and \
leaves the toolchain runnable (SPEC R-HANDOFF.8)."""

# Paths this profile asserts must NEVER become writable.
#
# Not a mechanism — the backends are allow-lists, so a path is unwritable simply
# by not being granted — but an *assertion* the tests check, so a later edit that
# "simplifies" the rules below into one broad `rw` grant on ~/.cargo fails loudly
# instead of quietly handing over the crates.io token.
#
#   bin/              — installed binaries; writable = arbitrary code on the
#                       user's PATH for every future shell
#   config.toml       — registry overrides; writable = redirect every future
#                       dependency fetch
#   credentials.toml  — the crates.io token
#
# All three stay read+execute via the ~/.cargo rule below. They are never writable.
deny_write = [
  "${CARGO_HOME:-~/.cargo}/bin",
  "${CARGO_HOME:-~/.cargo}/config.toml",
  "${CARGO_HOME:-~/.cargo}/credentials.toml",
]

# The toolchain itself: read + execute, never write. `~/.cargo/bin/cargo` and
# `~/.rustup/toolchains/*/bin/rustc` are binaries the sandboxed command must be
# able to *run*, which is strictly more than being able to read them.
[[rules]]
path = "${CARGO_HOME:-~/.cargo}"
access = "rx"

[[rules]]
path = "${RUSTUP_HOME:-~/.rustup}"
access = "rx"

# The caches cargo writes when it fetches a new dependency. Without these,
# `cargo add` and `cargo update` fail inside the sandbox — and the obvious
# workaround (granting all of ~/.cargo) would hand over the credentials too.
[[rules]]
path = "${CARGO_HOME:-~/.cargo}/registry"
access = "rw"
precreate = true

[[rules]]
path = "${CARGO_HOME:-~/.cargo}/git"
access = "rw"
precreate = true

# Cargo's cross-process lock files. They are files, not directories.
[[rules]]
path = "${CARGO_HOME:-~/.cargo}/.package-cache"
access = "rw"
kind = "file"
precreate = true

[[rules]]
path = "${CARGO_HOME:-~/.cargo}/.package-cache-mutate"
access = "rw"
kind = "file"
precreate = true

# ─────────────────────────────────────────────────────────────────────────────
# Hostnames this toolchain must reach when `--restrict-network` is on.
#
# Same idea as the path rules above, one layer out: a pre-answered bundle of
# grant questions, so that turning restriction on does not break `cargo build`
# on the first command. Ignored entirely when restriction is off (the default) —
# these lines widen nothing on a default install, they only make the *narrow*
# configuration usable.
#
# Every host here was verified against what cargo/rustup actually contact, not
# copied from a blog post; the `reason` is the verification, kept next to the
# entry so a future reader can re-check it rather than trust it.
# ─────────────────────────────────────────────────────────────────────────────

[[hosts]]
host = "index.crates.io"
reason = "sparse registry index — cargo's default dependency-resolution protocol since 1.70"

[[hosts]]
host = "static.crates.io"
reason = "crate .crate downloads; the `dl` endpoint named by https://index.crates.io/config.json"

[[hosts]]
host = "crates.io"
reason = "registry API (publish, yank, search, owner); the `api` endpoint named by config.json"

[[hosts]]
host = "static.rust-lang.org"
reason = "rustup channel manifests and toolchain/component downloads"

[[hosts]]
host = "github.com"
reason = "git dependencies over HTTPS, and the legacy git index rust-lang/crates.io-index"
