[package]
authors.workspace = true
edition.workspace = true
license = "AGPL-3.0-or-later"
name = "ahma_bin"
readme.workspace = true
rust-version.workspace = true
version.workspace = true
description = "The ahma binary: wires the MIT ahma_mcp library with the AGPL-licensed feature crates (vault, decompose, task_tree, worker, cluster, renewal, tui)."

# All first-party copyleft crates (ahma_vault, ahma_decompose, ahma_task_tree,
# ahma_worker, ahma_renewal, ahma_tui, ahma_cluster) are AGPL-3.0-or-later. The compiled
# ahma binary is therefore AGPL-3.0-or-later. See README for details.

[[bin]]
name = "ahma"
path = "src/main.rs"

[features]
# Batteries-included default: all features compiled in.
# Users building a lean binary can use --no-default-features.
default = ["cluster", "vault", "simplify"]
# Local cluster scheduler (`ahma cluster ...`): mDNS discovery, signed dispatch.
cluster = ["dep:ahma_cluster"]
# Task vault storage (`ahma vault ...`).
vault = ["dep:ahma_vault"]
# Code complexity analysis (`ahma simplify ...`).
simplify = ["ahma_mcp/simplify"]
# Everything, including incubating features (now same as default).
full = ["cluster", "vault", "simplify"]

[dependencies]
ahma_mcp = { path = "../ahma_mcp" }
ahma_core = { path = "../ahma_core" }
ahma_vault = { path = "../ahma_vault", optional = true }
ahma_task_tree = { path = "../ahma_task_tree" }
ahma_cluster = { path = "../ahma_cluster", optional = true }
ahma_tui = { path = "../ahma_tui" }
ahma_common = { path = "../ahma_common" }
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
clap-markdown = "0.1"
dirs.workspace = true
reqwest = { workspace = true, features = ["json", "rustls"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
