[package]
authors.workspace = true
edition.workspace = true
license = "AGPL-3.0-or-later"
name = "ahma_bin"
readme.workspace = true
rust-version.workspace = true
version.workspace = true
description = "The ahma binary: wires the MIT ahma_mcp library with the AGPL-licensed feature crates (tui)."
repository = "https://github.com/ahma-labs/ahma"
homepage = "https://github.com/ahma-labs/ahma"

# All first-party copyleft crates (ahma_tui) are AGPL-3.0-or-later. The compiled ahma binary is therefore
# AGPL-3.0-or-later. See README for details.

# ── cargo-binstall: fetch the prebuilt, attested release binary ──────────────
# Lets `cargo binstall --git https://github.com/ahma-labs/ahma ahma_bin` pull the
# CI-built GitHub Release asset instead of compiling from source (no RUSTFLAGS, no
# toolchain). The release archives are flat (binary `ahma` at the archive root) and
# named `ahma-release-<platform>.<ext>`, which is not binstall's default triple-based
# convention — hence one explicit `pkg-url` override per published target below.
# Keep these in sync with the `job-release-binaries` matrix in .github/workflows/build.yml.
# Note: binstall skips the shell installer's post-download steps — Sigstore attestation
# verification (run `ahma verify --self` afterward) and, on macOS, the hardened-runtime
# re-sign (see README "Install with Cargo"). Targets without an override fall back to a
# from-source build.
[package.metadata.binstall]
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/ahma-release-darwin-arm64.tar.gz"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/ahma-release-linux-x86_64.tar.gz"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/ahma-release-linux-arm64.tar.gz"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/ahma-release-linux-x86_64-musl.tar.gz"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/ahma-release-linux-arm64-musl.tar.gz"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/ahma-release-windows-x86_64.zip"
pkg-fmt = "zip"

[[bin]]
name = "ahma"
path = "src/main.rs"

[features]
# Batteries-included default: all *stable* features compiled in.
# Users building a lean binary can use --no-default-features.
default = ["simplify"]
# Code complexity analysis (`ahma simplify ...`): links the `ahma_simplify` crate
# and its rust-code-analysis toolchain into this binary. The feature lives HERE
# and only here — `ahma_mcp` must keep a single feature flavour (see
# docs/build-and-test-performance.md), so the subcommand is always listed by the
# CLI parser and a binary built without the feature reports a clear error.
simplify = ["dep:ahma_simplify"]
# OpenTelemetry distributed tracing/metrics export (`ahma serve --opentelemetry
# <url>`). Off by default: it pulls in the ~200-crate OpenTelemetry SDK
# subtree, which most builds never use. CI builds and tests this flavour
# separately and release archives ship a binary built with it (see
# docs/build-and-test-performance.md, "OpenTelemetry" finding, and
# ahma_common/Cargo.toml's `otel` feature comment). Forwards through
# `ahma_mcp/otel`, which forwards to `ahma_common/otel`; Cargo unifies that
# single `ahma_common` instance across this whole build, so `ahma_http_bridge`
# (a transitive dependency, embedded rather than depended-on directly here)
# picks it up too without ahma_bin needing its own edge to it.
otel = ["ahma_mcp/otel"]
# Everything, including incubating features (now same as default plus otel).
full = ["simplify", "otel"]

[dependencies]
ahma_mcp = { path = "../ahma_mcp" }
ahma_core = { path = "../ahma_core" }
ahma_simplify = { path = "../ahma_simplify", optional = true }
ahma_tui = { path = "../ahma_tui" }
ahma_common = { path = "../ahma_common" }
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
clap-markdown = "0.1"
dirs.workspace = true
reqwest = { workspace = true, features = ["json", "rustls"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
toml.workspace = true
tracing.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tempfile.workspace = true
