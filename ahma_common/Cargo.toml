[package]
name = "ahma_common"
description = "Shared configuration, timeout scaling, observability, TLS helpers, and cross-platform primitives for the ahma workspace (MIT OR Apache-2.0)."
authors.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
coverage = []
# The OpenTelemetry SDK subtree (~200 crates: opentelemetry, opentelemetry-otlp,
# opentelemetry_sdk, tracing-opentelemetry and their transitive deps) is compiled
# only under this feature. Off by default so every developer build/test cycle
# skips it; `ahma_bin --features otel` (forwarded from `ahma_mcp`/`ahma_http_bridge`,
# see their Cargo.tomls) turns it on, and CI builds and tests that flavour
# separately and ships it in release binaries (see
# docs/build-and-test-performance.md, "OpenTelemetry" finding).
# `src/observability.rs` keeps every function's public signature identical either
# way — without `otel`, `create_otel_layer` is a hard no-op regardless of config,
# so callers never need their own `#[cfg(feature = "otel")]`.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]

[dependencies]
parking_lot.workspace = true
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
sha2.workspace = true
dunce.workspace = true
url.workspace = true
# No default features: `rcgen`'s default is the `ring` provider, which would be a second
# rustls crypto provider next to the mandatory `aws-lc-rs` (rustls' default, and the only one
# sigstore/tough support). One provider per workspace; guarded by the
# `test_single_rustls_crypto_provider_invariant` test.
rcgen = { version = "0.14.8", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = [
    "sync",
    "net",
    "time",
    "io-util",
    "process",
    "fs",
] }
toml.workspace = true
uuid = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[[bin]]
name = "ahma_coverage"
path = "src/bin/ahma_coverage.rs"
required-features = ["coverage"]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "test-util"] }
