[package]
name = "ahma_common"
description = "Shared configuration, timeout scaling, observability, TLS helpers, and cross-platform primitives for the ahma workspace (MIT OR Apache-2.0)."
authors.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
coverage = []

[dependencies]
anyhow.workspace = true
dirs.workspace = true
dunce.workspace = true
url.workspace = true
rcgen = "0.13.2"
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = [
    "sync",
    "net",
    "time",
    "io-util",
    "process",
    "fs",
] }
toml.workspace = true
uuid = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }

[[bin]]
name = "ahma_coverage"
path = "src/bin/ahma_coverage.rs"
required-features = ["coverage"]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "test-util"] }
