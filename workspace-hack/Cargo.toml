[package]
name = "workspace-hack"
version = "0.1.0"
edition.workspace = true
description = "workspace-hack package, managed by hakari: pins one third-party feature set for every cargo invocation so `-p` builds reuse the workspace build's artifacts (see .config/hakari.toml)"
# Permissive so every crate, including the MIT OR Apache-2.0 engine crates, may depend on it.
# `cargo deny check licenses` refuses an unlicensed workspace member.
license = "MIT OR Apache-2.0"
# You can choose to publish this crate: see https://docs.rs/cargo-hakari/latest/cargo_hakari/publishing.
publish = false

