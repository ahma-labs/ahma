# .config/nextest.toml
#
# STABILITY DESIGN — read before modifying.
#
# History: the previous configuration maintained a hand-written list of individual
# test() name overrides to throttle subprocess-spawning tests on CI (2 CPUs). That
# list was always incomplete — new tests were added without being listed — causing
# un-throttled subprocess tests to run concurrently, starving the scheduler, and
# producing SSE handshake timeouts (the classic "works on M5, breaks on CI" pattern).
#
# Current approach uses STRUCTURAL filters (package / binary_id) so every test in
# scope is automatically covered without maintaining a name list.
#
# THROTTLING POLICY:
#
#   ahma_http_bridge
#     ALL tests in this package spawn an ahma HTTP server subprocess.
#     Covered by: package(ahma_http_bridge)
#
#   ahma_mcp integration tests
#     Integration test binaries have binary_id "ahma_mcp::<file-name>".
#     Many of them spawn ahma subprocess. Throttle all of them.
#     Covered by: binary_id(~ahma_mcp::)
#     NOT matched: the lib unit test binary "ahma_mcp" (no :: separator).
#     That binary runs in parallel — it is in-process and fast.
#
#   Everything else
#     Runs with full parallelism; no throttle needed.
#
# ADDING A NEW SUBPROCESS-SPAWNING TEST:
#   - In ahma_http_bridge/tests/:  nothing to do, package filter covers it.
#   - In ahma_mcp/tests/:          nothing to do, binary_id filter covers it.
#   - In a NEW package:            add a package() or binary_id() filter below.
#     Do NOT add individual test() name overrides — they break as the codebase grows.
#
# ---------------------------------------------------------------------------
# OVERRIDE ORDER — the first matching override wins, PER SETTING.
# ---------------------------------------------------------------------------
#
# nextest does NOT pick the most specific filter. For each setting it takes the
# value from the FIRST override in file order that both matches the test and
# defines that setting. Verified empirically: with a broad `package()` override
# listing `retries = 3` above a narrow `binary_id()` override listing
# `retries = 1`, the test ran 4 times; swapping the two ran it twice.
#
# Consequence: **narrow overrides must be listed ABOVE the broad ones they
# refine**, or their settings are silently dead config. This bit us — the
# `bridge_stress_tests` overrides sat below `package(ahma_http_bridge)` and
# asked for slow-timeouts (240s on dev, a reduced 240s backstop on CI) that
# never took effect, because the package override defined `slow-timeout` first.
# Both are now ordered narrow-first.
#
# ---------------------------------------------------------------------------
# RETRY POLICY — which tests may retry on CI, and why that is not bug-hiding.
# ---------------------------------------------------------------------------
#
# Retries are granted STRUCTURALLY, by the same package/binary_id filters used
# for throttling, to every suite whose tests cross a PROCESS or NETWORK boundary
# and therefore depend on OS scheduling:
#
#   package(ahma_http_bridge)   spawns an ahma HTTP server subprocess
#   binary_id(~ahma_mcp::)      spawns `ahma serve stdio`, handshakes over pipes
#   binary_id(~ahma_tui::)      binds real loopback TCP/QUIC/Unix sockets and
#                               asserts against wall-clock timeouts
#
# These are the suites that produce the "works on M-series, times out on a cold
# 2-CPU Windows runner" flake this file's header describes. A retry only rescues
# a flake: a genuinely broken test fails all three attempts, so this never hides
# a real regression — it only stops a scheduler hiccup from reddening main.
#
# NOT granted retries, deliberately:
#   - Every lib unit test binary (no `::` in the binary_id). These are
#     in-process and deterministic; if one is flaky that is a real bug and the
#     retry would mask it.
#   - wiremock/MockServer-backed suites (ahma_llm_monitor, ahma_http_mcp_client)
#     — in-process mocks, no subprocess, no scheduling dependence.
#   - ahma_core — pure filesystem and logic.
#   - The `default` profile (developer machines). Devs should SEE flakes.
#
# Retries apply to `ci` and `coverage`, the two profiles that run on GitHub
# runners. `smoke` excludes all of the above suites via its default-filter, so
# retries there would be inert.
#
# ADDING RETRIES FOR A NEW SUITE: justify it by MECHANISM (does it cross a
# process/network boundary?), not by "it failed once". If a test is flaky
# without crossing such a boundary, fix the test.

# ---------------------------------------------------------------------------
# Default profile (developer machines — threads-required throttle, no global cap)
# ---------------------------------------------------------------------------
#
# Note: `threads-required` is set on subprocess-heavy test packages to
# throttle concurrent subprocess count.  This prevents IPC pipe back-pressure
# and SSE handshake timeouts that occur when all bridge / ahma_mcp integration
# tests run simultaneously.  It is NOT a global `test-threads` cap — other
# tests (unit tests, etc.) still run with full parallelism.

[profile.default]
slow-timeout = { period = "60s", terminate-after = 2 }
failure-output = "immediate"
success-output = "immediate"

# Bridge tests spawn server subprocesses and need longer slow-timeout headroom
# even on fast developer machines under load.
# threads-required = 4 caps concurrent bridge tests at (num-cpus / 4) without
# adding a global test-threads limit, preventing IPC pipe starvation.
# Using 4 (not 2) so that on a 10-CPU machine only ~2 bridge tests run at once;
# this prevents handshake timeouts when --run-ignored all adds extra load.
#
# P5 NOTE: As bridge tests migrate to the in-process harness (spawn_in_process_server /
# setup_in_process_mcp), the subprocess count drops and this throttle can be relaxed.
# Target: keep threads-required = 4 for the subprocess smoke suite, but exclude
# the in-process test binary from throttling once it is split into its own file
# (e.g. `ahma_http_bridge::in_process_*`).
# Stress tests fan out concurrent PowerShell spawns.  Even at the reduced
# Windows CI count (3 requests) the join_all wall-time can exceed 120 s on a
# cold 2-CPU runner.  Grant extra headroom via a more specific filter.
#
# MUST stay above the package(ahma_http_bridge) override — see OVERRIDE ORDER
# in the header. It previously sat below it, so this 240s never applied.
[[profile.default.overrides]]
filter = "binary_id(ahma_http_bridge::bridge_stress_tests)"
threads-required = 4
slow-timeout = { period = "240s", terminate-after = 2 }

[[profile.default.overrides]]
filter = "package(ahma_http_bridge)"
threads-required = 4
slow-timeout = { period = "120s", terminate-after = 2 }

# NOTE: there are no fs-watching tests to serialize any more. The tool-config
# directory watcher was removed outright (SPEC R1.4 / R-HANDOFF.7 — the tools
# directory is agent-writable, so watching it executes a write with no user
# action), which also retired the drop-order deadlock its notify thread could
# form under load. Reload happens only through the explicit `restart` tool.

# Many ahma_mcp integration test binaries spawn ahma subprocess.
# Throttle all integration tests (binary_id "ahma_mcp::*") to prevent
# scheduler starvation when running concurrently with bridge tests.
[[profile.default.overrides]]
filter = "binary_id(~ahma_mcp::)"
threads-required = 2

# ---------------------------------------------------------------------------
# CI profile — activated by: cargo nextest run --profile ci
# On GitHub Actions, test-threads = "num-cpus" = 2.
# ---------------------------------------------------------------------------

[profile.ci]
test-threads = "num-cpus"
slow-timeout = { period = "120s", terminate-after = 2 }
failure-output = "immediate"
success-output = "never"
retries = 0

# Stress tests fan out concurrent PowerShell spawns.  Even at the reduced
# Windows CI count (3 requests), an SSE handshake that stalls (e.g. the
# sandbox-configured notification is delayed) can block until the package-level
# 360s hard kill (period * terminate-after = 180 * 2) fires with no diagnostic.
# The per-test initialize_with_roots call is now wrapped in a 60s timeout so
# the test skips gracefully.  This override reduces the nextest backstop from
# 360s to 240s as a secondary safety net.
#
# MUST stay above the package(ahma_http_bridge) override — see OVERRIDE ORDER
# in the header. It previously sat below it, so this reduced backstop never
# applied; the package-level 180s won and the hard kill stayed at 360s.
[[profile.ci.overrides]]
filter = "binary_id(ahma_http_bridge::bridge_stress_tests)"
threads-required = 2
slow-timeout = { period = "120s", terminate-after = 2 }
retries = 2

# Every test in ahma_http_bridge spawns a server subprocess.
# threads-required = 2 with test-threads = 2 => only 1 bridge test at a time.
# This prevents port conflicts, CPU starvation, and SSE handshake timeouts.
#
# retries: per the RETRY POLICY in the header — every test in this package
# crosses a process boundary and completes an HTTP/SSE handshake against it, so
# all of them are exposed to the same 2-CPU-Windows scheduling stalls. This was
# previously granted only to bridge_stress_tests, which left the rest of the
# package on retries = 0 and let a single stall redden main: run 31938851995
# failed solely on `handshake_concurrency_test test_slow_client_handshake`
# (4344/4345 passed), and the very next run over a superset of the same commits
# passed on the same Windows runner.
[[profile.ci.overrides]]
filter = "package(ahma_http_bridge)"
threads-required = 2
slow-timeout = { period = "180s", terminate-after = 2 }
retries = 2

# Many ahma_mcp integration test binaries spawn ahma subprocess.
# Throttle all integration tests (binary_id "ahma_mcp::*") to 1 at a time.
# The main lib test binary ("ahma_mcp", no :: separator) is NOT matched and
# runs in parallel with other non-subprocess tests.
#
# retries: these tests spawn `ahma serve stdio` and complete an MCP handshake
# over pipes. On the slow 2-CPU Windows runner that startup/handshake
# occasionally stalls past the 120s backstop (the "works on M-series, times out
# on CI" flake this file's header describes — e.g. config_reload_test hanging at
# exactly period*terminate-after). Retries only rescue a flake; a genuinely
# broken test still fails every attempt, so this never hides real bugs.
[[profile.ci.overrides]]
filter = "binary_id(~ahma_mcp::)"
threads-required = 2
retries = 2

# TUI connection tests bind real loopback TCP/QUIC/Unix sockets and assert
# against wall-clock timeouts (health-check polling, transient-409 retry,
# unreachable-endpoint error text). The bridge they talk to is in-process, so
# they need no subprocess throttle — but the socket setup and the timeouts are
# still at the mercy of a cold 2-CPU runner's scheduler, which is the same
# mechanism the RETRY POLICY covers. The lib unit binary ("ahma_tui", no ::)
# is deliberately NOT matched.
[[profile.ci.overrides]]
filter = "binary_id(~ahma_tui::)"
retries = 2


# ---------------------------------------------------------------------------
# Coverage profile (cargo llvm-cov) — instrumentation slows tests significantly
# ---------------------------------------------------------------------------
#
# IMPORTANT: coverage mode MUST mirror the subprocess-throttling intent of the
# CI profile.  llvm-cov instrumentation adds binary-loading and pipe-I/O
# overhead that is 2-4x worse than a plain run.  Without these overrides,
# bridge and ahma_mcp subprocess tests compete for the scheduler and produce
# assertion timeouts (e.g. fast-error-response tests fail because the real
# round-trip time exceeds the 2-second assertion budget).

[profile.coverage]
test-threads = "num-cpus"
slow-timeout = { period = "1800s", terminate-after = 2 }
failure-output = "immediate"
success-output = "never"
retries = 0

# Bridge tests spawn server subprocesses. Under coverage, binary loading and
# IPC are substantially slower. threads-required = 2 with test-threads = num-cpus
# (= 2 on CI) means only 1 bridge test runs at a time — preventing scheduler
# starvation and fast-error assertion breaches.
#
# retries: same RETRY POLICY as the ci profile, and if anything more warranted —
# llvm-cov instrumentation makes exactly the process/IPC overhead these tests
# depend on 2-4x worse. A retry re-runs the binary and its counters merge into
# the same report, so this does not distort coverage.
[[profile.coverage.overrides]]
filter = "package(ahma_http_bridge)"
threads-required = 2
slow-timeout = { period = "600s", terminate-after = 2 }
retries = 2

# Many ahma_mcp integration test binaries spawn ahma subprocess.
# Same throttle as CI — prevents concurrent subprocess starvation.
[[profile.coverage.overrides]]
filter = "binary_id(~ahma_mcp::)"
threads-required = 2
retries = 2

# TUI connection tests — real loopback sockets with wall-clock timeouts.
# See the ci profile's equivalent override.
[[profile.coverage.overrides]]
filter = "binary_id(~ahma_tui::)"
retries = 2


# ---------------------------------------------------------------------------
# Smoke profile — the PR FAST TIER (.github/workflows/fast-tier.yml)
# Activated by: cargo nextest run --profile smoke
# ---------------------------------------------------------------------------
#
# Purpose: sub-6-minute fast feedback on every PR iteration push. This is NOT full
# coverage — the full cross-platform matrix at the MERGE GATE (build.yml on merge_group)
# is the authority. Smoke deliberately EXCLUDES the subprocess-spawning integration tests
# (which fork `ahma serve` and complete an MCP handshake over pipes — the slow, throttled,
# occasionally-flaky suite) and the Android/Kotlin tests. What remains — every crate's lib
# unit tests, the ahma_mcp lib unit binary (no `::`), and all in-process tests in other
# packages — runs with FULL parallelism (no subprocess throttle needed), catching compile
# errors and logic regressions fast. The merge gate catches the rest before anything lands.
#
# default-filter is applied automatically; the fast-tier job just runs `--profile smoke`.
[profile.smoke]
default-filter = "not (package(ahma_http_bridge) or binary_id(~ahma_mcp::) or test(kotlin) or test(android))"
slow-timeout = { period = "60s", terminate-after = 2 }
failure-output = "immediate"
success-output = "never"
retries = 0
