[package]
authors.workspace = true
edition.workspace = true
license.workspace = true
name = "ahma_simplify"
description = "Code complexity analysis behind `ahma simplify`: per-file simplicity scores, hotspot ranking, Markdown/HTML reports and AI fix prompts (MIT OR Apache-2.0)."
readme.workspace = true
rust-version.workspace = true
version.workspace = true

# Same verdict as ahma_mcp, which this code was extracted from: quick-xml 0.41
# deprecates `unescape_value` in favour of `normalized_value(XmlVersion)`, but
# the replacement also collapses attribute whitespace — a behaviour change, not a
# rename — so the migration is deliberate work, not a lint fix.
[lints.rust]
deprecated = "allow"

[dependencies]
ahma_common = { path = "../ahma_common" }
anyhow.workspace = true
chrono.workspace = true
dunce.workspace = true
opener = "0.8"
pulldown-cmark = "0.13"
quick-xml = "0.41"
regex = { workspace = true }
rust-code-analysis = { package = "rust-code-analysis-code-split", version = "0.0.26-cs.0" }
rustc-hash = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
# Pinned to the exact version rust-code-analysis-code-split pins, because we walk
# the `tree_sitter::Node` its parser hands back; a mismatch is two incompatible
# copies of the type, not a version bump.
tree-sitter = "=0.26.9"
toml.workspace = true
walkdir = "2.5"
globset = "0.4"
ignore = "0.4"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
clap.workspace = true
tempfile.workspace = true
walkdir = "2.5"
